schema_version: 2
# Relation 只能从以下 Registry 定义中选择；无法精确分类时不要创建 relation，并记录 review gap。
# - belongs_to: capability → domain；记录 capability 的架构所有权。；禁止 note
# - invokes: caller → callee；一个 capability 在运行时主动调用另一个 capability。；note 可选，最多 200 字符
# - consumes: consumer → provider；交互核心是读取或依赖提供内容。；note 可选，最多 200 字符
# - precedes: earlier → later；执行顺序是正确性合同。；note 可选，最多 200 字符
# - constrains: constraint owner → constrained capability；存在独立且稳定的行为约束。；note 可选，最多 200 字符
# - validates: validator → subject；交互结果是明确的有效性判定。；note 可选，最多 200 字符
ADDED:
  capabilities:
    - id: cap.example.feature
      type: capability
      intent: 描述新增 capability
  relations:
    - from: cap.example.feature
      type: belongs_to
      to: dom.example
MODIFIED:
  capabilities:
    - id: cap.example.existing
      intent: 更新后的 intent
REMOVED:
  capabilities:
    - id: cap.example.legacy
