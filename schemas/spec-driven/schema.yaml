name: spec-driven
version: 1
description: Default OPSX workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    definition:
      purpose: Explain why the change is needed and declare its semantic source scope.
      compilationRole: Compilation scaffolding for motivation and source impact.
      content:
        includes:
          - Motivation, scope boundaries, Behavior Source impact, Architecture Source impact, and affected surfaces.
        excludes:
          - Complete observable behavior requirements, authoritative LikeC4 element or relation declarations, lowering decisions, and implementation work.
      writePolicy: agent-authored
      validation:
        - opsx validate --change <name> --json
    instruction: |
      Create `proposal.md` to explain why the change is needed and bound its semantic source impact.

      Use the template sections:
      - **Why**: State the problem or opportunity and why it matters now in 1-2 sentences.
      - **What Changes**: Summarize intended outcomes and scope, not detailed requirements or implementation steps. Mark breaking changes with **BREAKING**.
      - **Source Impact**:
        - **Behavior Source**: List `New Specs` and `Modified Specs` by Spec ID. Write `None` when behavior source does not change.
        - **Architecture Source**: List affected LikeC4 element IDs when known and summarize responsibility, ownership, boundary, or relation impact. Write `None` when architecture source does not change.
      - **Impact**: List affected code, APIs, dependencies, data, operations, or systems.

      Keep Spec IDs and LikeC4 element IDs distinct:
      - A Spec ID is the folder name used by `specs/<spec-id>/spec.md`.
      - A LikeC4 element ID uses the generated `domain_name.capability_name` form; canonical capability identity remains in metadata.capabilityId.
      - A Spec may cover multiple architecture capabilities; do not assume a one-to-one mapping.

      Use existing Spec and LikeC4 element IDs when they already describe the affected behavior or architecture. Introduce a new ID only for genuinely new behavior source or architecture concepts.

      The proposal declares source impact; it does not define the source:
      - Complete observable behavior belongs in delta Specs.
      - Complete target-state LikeC4 elements and relations belong in `architecture-delta.c4`.
      - Lowering and architecture decisions belong in `design.md`.
      - Implementation work and verification belong in `tasks.md`.

      Every New or Modified Spec entry must be reconciled by a corresponding change-local delta Spec. Every declared durable architecture impact must be reconciled through `architecture-delta.c4`.

      Keep the proposal concise. Do not repeat detailed requirements, architecture definitions, design rationale, or task steps.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    completionMarker: ".specs-noop"
    description: Detailed specifications for the change
    template: spec.md
    definition:
      purpose: Define the observable behavior the target program must exhibit.
      compilationRole: Behavior semantic source delta reconciled into formal Specs.
      content:
        includes:
          - Complete target-state requirements and scenarios expressed through delta sections.
        excludes:
          - Implementation decisions, rationale, task planning, architecture semantics, change-log narration, and Agent reasoning.
      writePolicy: agent-authored
      validation:
        - opsx validate --change <name> --artifacts specs --json
    instruction: |
      Create or reconcile the change-local delta Specs declared in `proposal.md` → `Source Impact` → `Behavior Source`.

      If Behavior Source is confirmed as `None`, create only the empty `.specs-noop` completion marker in the change root. Otherwise remove a stale `.specs-noop` marker before authoring delta Specs. The marker carries no behavior semantics and MUST NOT be synced or archived.

      Identify target files:
      - Each `New Specs` entry uses its Spec ID at `specs/<spec-id>/spec.md`.
      - Each `Modified Specs` entry reuses the exact existing Spec ID from `.opsx/specs/<spec-id>/spec.md`.
      - Spec IDs and architecture capability IDs are different identifiers. Do not use a `cap.<domain>.<name>` ID as a Spec directory name unless that exact string is independently the declared Spec ID.
      - Do not create a delta Spec for Architecture Source impact alone.

      Use Requirement-level delta operations:
      - `## ADDED Requirements`: requirements absent from the formal Spec.
      - `## MODIFIED Requirements`: existing requirements whose observable behavior changes. Copy the complete formal Requirement block, then edit it into the target state.
      - `## REMOVED Requirements`: existing requirements removed from the target behavior. Include `Reason` and `Migration`.
      - Requirement rename uses `## REMOVED Requirements` for the old title plus `## ADDED Requirements` for the new complete target block. `## RENAMED Requirements` is unsupported.
      - A `Modified Specs` file may contain any combination of the three supported operations. Do not infer the Requirement operation from the Spec classification alone.

      Before writing an operation against an existing Spec:
      - read `.opsx/specs/<spec-id>/spec.md`;
      - use the exact existing Requirement title for `MODIFIED` or `REMOVED`;
      - keep a `MODIFIED` Requirement complete, including all surviving scenarios;
      - use `ADDED` when existing behavior remains unchanged and the target Spec gains a separate requirement.

      Author canonical behavior:
      - `### Requirement:` and `#### Scenario:` markers remain canonical. Each requirement uses `### Requirement: <name>`.
      - Normative text uses `SHALL` or `MUST`.
      - Each surviving requirement has at least one `#### Scenario: <name>` with observable `WHEN`/`THEN` outcomes.
      - Requirements describe the target steady state without change-history narration.
      - Existing Requirement titles under `MODIFIED Requirements` remain exact for matching. New Requirement titles and new Scenario titles follow `proseLanguage`.

      Route content that does not belong in Specs:
      - motivation or scope → `proposal.md`;
      - solution architecture, lowering decisions, rationale, or refactoring strategy → `design.md`;
      - implementation work and verification → `tasks.md`;
      - durable architecture elements, ownership, boundaries, or semantic relations → `architecture-delta.c4`.

      Agent MUST NOT author Scenario operation labels. Validation rejects operation-like bracket prefixes; Scenario operations are derived by `opsx validate --change <name>` and `opsx diff --change <name> --write`.

      Follow the returned template structure. Do not add placeholders, empty delta sections, examples, or process notes to the artifact.
    requires:
      - proposal

  - id: architecture-delta
    generates: architecture-delta.c4
    description: LikeC4 architecture source delta for this change
    template: architecture-delta.c4
    definition:
      purpose: Define the architecture source changes required by the target system.
      compilationRole: Architecture semantic source delta reconciled into formal LikeC4.
      content:
        includes:
          - Minimal target-state LikeC4 element and typed relation reconciliation.
        excludes:
          - Observable behavior requirements, implementation evidence, code paths, symbols, imports, calls, and change-log narration.
      writePolicy: agent-authored
      validation:
        - opsx validate --change <name> --artifacts architecture-delta --json
    instruction: |
      Create `architecture-delta.c4` as the architecture source reconciliation for this change.

      Determine the target architecture from proposal `Architecture Source`, completed change-local Specs, `design.md` when present, the formal model under `.opsx/architecture/`, and current code as implementation evidence.

      Keep source identities separate:
      - Spec IDs under proposal `Behavior Source` are not LikeC4 element IDs.
      - Proposal Architecture Source entries declare scope, not authoritative LikeC4 declarations.
      - Only `architecture-delta.c4` defines exact target-state element and typed relation reconciliation.

      Handle no-op architecture explicitly:
      - If Architecture Source is `None` and available source and evidence confirm no durable architecture change, write `model {}`.
      - Do not use a no-op delta while architecture impact is unresolved.
      - Observable behavior changes alone do not require architecture operations.

      When architecture changes, use the minimum LikeC4 declarations required for the target state:
      - `extend existing_domain { ... }` for capabilities added to existing domains.
      - Complete `domain` declarations for new domains.
      - Typed relations using `source -[kind]-> target`, with canonical kinds `invokes`, `consumes`, `precedes`, `constrains`, and `validates`.
      - Capability metadata preserves canonical `capabilityId`, status, and change-local Specs paths.

      Preserve relation direction and endpoint contracts. Element nesting expresses ownership, so do not emit explicit `belongs_to` relations. Imports and calls are evidence only. Do not include code paths, symbols, imports, calls, or Agent reasoning.

      Validate with `opsx validate --change "<name>" --artifacts architecture-delta --json`.
    requires:
      - specs

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    definition:
      purpose: Record concrete lowering and architecture decisions that the Agent must not guess.
      compilationRole: Compilation scaffolding for implementation strategy, architecture, and constraints.
      content:
        includes:
          - Solution architecture, implementation boundaries, technical decisions, rationale, alternatives, refactoring strategy, risks, trade-offs, and migration decisions.
        excludes:
          - Observable behavior requirements, task progress, repeated motivation, and durable architecture changes not reconciled through architecture-delta.c4.
      writePolicy: agent-authored
      validation:
        - opsx validate --change <name> --json
    instruction: |
      Create the design document that explains HOW to implement the change.
      Use design.md for technical decisions, refactor rationale, rejected approaches, exploration decisions, implementation strategy, and why an old path should not be used. These belong here instead of specs unless they change externally observable behavior.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Coarse implementation tasks with verification checks
    template: tasks.md
    definition:
      purpose: Decompose implementation into executable, evidence-gated work units.
      compilationRole: Compilation scaffolding for sequencing and verification.
      content:
        includes:
          - Coarse work units, affected files, implementation constraints, executable checks, commands, and evidence anchors.
        excludes:
          - New observable behavior, architecture semantics, repeated design rationale, and non-verifiable narration.
      writePolicy: agent-authored
      validation:
        - opsx validate --change <name> --json
    instruction: |
      Create a coarse-grained task list with executable Checks that the apply phase can run through strict evidence gates.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      `### Task N:` headings and nested checkboxes to track progress.

      Required structure:
      - Create one `### Task N: <name>` section per component or coherent work unit
      - Each task MUST include `**Goal**:`, `**Files**:`, `**Requirements**:`, and `#### Checks`
      - `Files` MUST use POSIX project-relative paths and label each path as `Create:`, `Modify:`, `Delete:`, or `Test:`
      - File-level deletions (including moves and merges that produce deletions) use `Delete:` declaration; generated-surface changes (such as skill regeneration directories) should be declared at directory granularity
      - `Requirements` MUST contain no more than 5 bullet items per task; split complex work into multiple tasks
      - `Checks` are executable verification items and MUST use checkbox IDs prefixed with `C`: `- [ ] C1 Verify ...`
      - Each check MUST include `Verifies:` or `Preserves:` before executable evidence fields
      - `Verifies:` identifies the change-local spec requirement and scenario(s); for deletion deliverables, use `Verifies: ... / REMOVED Requirement "<name>"` (no Scenario required)
      - `Preserves:` anchors behavior-equivalence checks to main spec paths (`.opsx/specs/<capability>/spec.md` / Requirement "<name>" / Scenario "<name>"), naming old forms in `Expect:` and absence assertion in `Command:`
      - Each check MUST include at least one executable evidence field: `Command:`, `Evidence:`, or `Expect:`
      - When this change has local delta specs, `Verifies:` MUST use a change-local relative POSIX path from the change directory: `specs/<capability>/spec.md`
      - `Verifies:` MUST name the full Requirement title and one or more exact canonical unlabeled Scenario names; except for REMOVED Requirement variant
      - `Verifies:` MUST NOT use `.opsx/specs/...`, project-root-relative paths, archived/main spec paths, absolute paths, parent traversal, or backslash-separated paths
      - `Preserves:` path whitelist is independent: only `.opsx/specs/<capability>/spec.md` is allowed; it does not relax `Verifies:` constraints

      Conversion rules:
      - Task titles, check names, requirements bullet prose, and Evidence:/Expect: descriptions follow `proseLanguage` when configured.
      - Structural labels such as `### Task N:`, `Goal`, `Files`, `Requirements`, `Checks`, `Verifies:`, `Command:`, `Evidence:`, and `Expect:` remain canonical.
      - Examples show structure only. When `proseLanguage` is configured, do not carry over ordinary English example prose into generated artifacts.
      - Generate one task from each major component in the design or Design Summary
      - Put technical stack constraints and boundary conditions under Requirements, not free-form prose
      - Validation work maps to checks for invalid-input behavior
      - Bug fixes map to a check that reproduces the failure and proves the regression fix
      - Refactors map to a behavior-equivalence check: use `Preserves:` field anchoring a main spec requirement with scenarios, `Expect:` naming the old form (old symbol, old path, or old duplication), and `Command:` with corresponding absence assertion
      - Deletion work maps to a check anchored by `Verifies: ... / REMOVED Requirement "<name>"` (no Scenario variant) with an absence assertion command
      - non-runtime text or non-runtime artifact changes do not require artificial failing tests, but still need at least one lightweight check with a non-empty `Verifies:` explaining how completion will be verified
      - config, schema, template, workflow template, and agent instruction template changes default to behavior Checks unless the task proves there is no runtime or generated-surface consumer
      - Absence assertions (such as grep empty assertions after deletion) are handled by the non-runtime text fast path: use `Command:` output as final evidence, do not require artificial red/green form
      - Existing Actions/Checks files remain valid for older changes, but new changes SHOULD use the Task/Goal/Files/Requirements/Checks format

      Example:
      ```
      ### Task 1: User registration API

      **Goal**: Implement email and password registration.

      **Files**:
      - Create: `src/routes/auth.ts`
      - Modify: `src/app.ts`
      - Test: `tests/auth.test.ts`

      **Requirements**:
      - Accept `POST /auth/register`
      - Validate email format
      - Hash passwords before storage

      #### Checks

      - [ ] C1 Verify registration endpoint
        - Verifies: `specs/auth/spec.md` / Requirement "User registration" / Scenario "Valid registration succeeds"
        - Command: `npm test`
        - Expect: registration test passes

      - [ ] C2 Verify invalid email rejection
        - Verifies: `specs/auth/spec.md` / Requirement "User registration" / Scenario "Invalid email is rejected"
        - Command: `npm test`
        - Expect: invalid email test passes
      ```

      Reference specs for what needs to be built, design for how to build it.
      Checks are executable verification work, not explanatory prose. The apply phase will execute each pending behavior/code Check through strict red/green TDD and mark checks complete only after red/green evidence or final non-runtime evidence passes.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files and execute each pending behavior/code Check through strict red/green TDD: add or update the targeted test first, run the Check command or equivalent targeted command and confirm the expected failure before implementation, make the minimal implementation, then rerun and confirm pass before marking nested Checks complete.
    For non-runtime text or artifact Checks, do not create artificial failing tests; use the declared Command, Evidence, or Expect fields as final evidence.
    Config, schema, template, workflow template, and agent instruction template Checks default to behavior Checks unless the task proves there is no runtime or generated-surface consumer.
    Pause if you hit blockers or need clarification.
