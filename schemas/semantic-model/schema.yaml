name: semantic-model
version: 1
description: Default Xirang workflow - proposal → semantic-delta → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    definition:
      purpose: Explain why the change is needed and declare its semantic source scope.
      compilationRole: Compilation scaffolding for motivation and source impact.
      content:
        includes:
          - Motivation, scope boundaries, Behavior Source impact, Architecture Source impact, and affected surfaces.
        excludes:
          - Complete observable behavior requirements, complete target-state Semantic Delta entries, lowering decisions, and implementation work.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
    instruction: |
      Create `proposal.md` to explain why the change is needed and bound its semantic source impact.

      Use the template sections:
      - **Why**: State the problem or opportunity and why it matters now in 1-2 sentences.
      - **What Changes**: Summarize intended outcomes and scope, not detailed requirements or implementation steps. Mark breaking changes with **BREAKING**.
      - **Source Impact**:
        - **Behavior Source**: List `New Specs` and `Modified Specs` by element identity. Write `None` when behavior source does not change.
        - **Architecture Source**: List affected element identities and summarize responsibility, ownership, boundary, or relationship impact. Write `None` when architecture source does not change.
      - **Impact**: List affected code, APIs, dependencies, data, operations, or systems.

      Use one shared identity space. Reuse an existing element identity when it already denotes the affected semantic object; introduce one only for a genuinely new Element. An Element has at most one Contract, so Behavior Source and Architecture Source may refer to the same identity.

      The proposal declares source impact; it does not define target content:
      - Complete target-state Semantic Delta entries belong in `elements/`, `metamodel/`, `relationships/`, and `views/`.
      - Lowering and architecture decisions belong in `design.md`.
      - Implementation work and verification belong in `tasks.md`.

      Every declared durable semantic impact must be reconciled through the appropriate Delta partition. Keep the proposal concise and do not repeat requirements, target entries, design rationale, or task steps.
    requires: []

  - id: semantic-delta
    generates: "{elements,metamodel,relationships,views}/**/*"
    completionMarker: ".delta-noop"
    description: Semantic Delta units for the change
    template: delta.md
    definition:
      purpose: Express the semantics this Change adds, modifies, or removes.
      compilationRole: Semantic Delta compiled against the current Semantic Model.
      content:
        includes:
          - Complete target-state Semantic Delta entries across elements, metamodel, relationships, and views.
        excludes:
          - Motivation, implementation decisions, rationale, task planning, change-log narration, and Agent reasoning.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
        - xirang arch validate --change <name> --json
    instruction: |
      Create or reconcile the Change's Semantic Delta across `elements/`, `metamodel/`, `relationships/`, and `views/`.

      Treat the returned template as a per-unit shape reference, not one file to copy. If no Semantic Delta is required, create only `.delta-noop`; otherwise remove a stale marker. The marker carries no semantics and MUST NOT be synced or archived.

      Author units by self-declared entity type:
      - Frontmatter declares `entity`; the partition does not determine entity type.
      - element-declaration: identity, kind, parent, title, definition
      - element-kind: identity, contract; optional contractFormat, root, parents, children
      - relationship-kind: identity; optional sourceKinds, targetKinds
      - authored-view: identity, include; optional exclude, of, title, autoLayout
      - Every identity uses `[A-Za-z0-9._-]+`, never a path separator, and must not encode parent hierarchy.
      - Default filenames are organizational conventions only; unchanged partitions stay empty.

      Apply Delta semantics per entry:
      - Declaration, Kind, and View entries add `operation: ADDED|MODIFIED|REMOVED`; ADDED and MODIFIED carry complete target content, while REMOVED carries only identity.
      - Element Contract target content is `## Specification`; Delta Section entries factor operation into `## ADDED Sections`, `## MODIFIED Sections`, and `## REMOVED Sections` sections.
      - ADDED and MODIFIED Sections contain the complete target Section with a canonical `### Section:` header and a free body; REMOVED names only the Section.
      - Each ADDED or MODIFIED Section must contain the uppercase keyword `SHALL` or `MUST` in its own body, before any Acceptance Case headers; keywords only inside case bodies do not satisfy this format check. Restate the confirmed commitment without adding a new restriction.
      - Existing titles under MODIFIED Sections stay exact; new Section titles follow `proseLanguage` except the four fixed English business-specification titles.
      - Agent MUST NOT author Acceptance Case operation labels.
      - When only Contract entries change, declaration frontmatter locates the Element without `operation`; when only the Declaration changes, leave the body empty.

      Follow partition-specific rules:
      - `elements/` units combine one Element Declaration entry with zero or more Section entries. A Section identity is `<element identity>#<title>` globally and only `<title>` within its unit; complete concept identity and scope prose belongs only in `definition`.
      - `metamodel/` units contain one Element Kind or Relationship Kind entry.
      - `views/` units contain one Authored View entry.
      - `relationships/` YAML contains `{operation, source, kind, target}` entries, has no description field, and does not support `MODIFIED` because the three identity fields are its complete content.

      For business-specification Kinds and Contracts, follow project-root file `.xirang/references/xirang-business-specification-standard.md`, loading it only when applicable and not already current. That reference owns applicability, mandatory Sections, Acceptance Cases and self-checks. A Delta includes only changed Sections; CLI checks the complete Expected Contract.

      Route motivation to `proposal.md`, decisions to `design.md`, and implementation work to `tasks.md`. Validate with the commands from `definition.validation`, and do not add placeholders, empty Delta sections, or process notes to authored units.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    definition:
      purpose: Record concrete lowering and architecture decisions that the Agent must not guess.
      compilationRole: Compilation scaffolding for implementation strategy, architecture, and constraints.
      content:
        includes:
          - Solution architecture, implementation boundaries, technical decisions, rationale, alternatives, refactoring strategy, risks, trade-offs, and migration decisions.
        excludes:
          - Observable behavior requirements, task progress, repeated motivation, and durable semantic changes not reconciled through the four Delta partitions.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
    instruction: |
      Create the design document that explains HOW to implement the change, documenting confirmed design decisions. Reuse Explore conclusions and the current framing record. Reasonable inferred details, including supporting guarantees, may be authored within the agreed scope and approach without separate confirmation; explain their basis and disclose them at completion. Check authored branch outcomes, defaults, error results and restrictions against confirmed commitments. Changes to confirmed commitments, scope expansion or material business/architecture trade-offs require asking the user before treating a choice as settled. An isolated gap can be confirmed within Propose; substantial redesign returns to Explore.
      Use design.md for technical decisions, refactor rationale, rejected approaches, exploration decisions, implementation strategy, and why an old path should not be used. These belong here instead of semantic-delta unless they change externally observable behavior. Reconcile confirmed observable behavior and inferred guarantees with the Semantic Delta and tasks rather than defining it only in design.md.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and semantic-delta for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Goal-level implementation objectives and verification directions
    template: tasks.md
    definition:
      purpose: Decompose implementation into executable, evidence-gated work units.
      compilationRole: Goal-level implementation objectives and verification directions; goal checkboxes are progress markers, not file inventories or executable checks.
      content:
        includes:
          - Goal-level implementation objectives, Contract references, verification directions, and target-level completion state.
        excludes:
          - New observable behavior, architecture semantics, repeated design rationale, and non-verifiable narration.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
    instruction: |
      Create a goal-level task list for Apply. Each goal identifies an intended outcome, references its Contract Section, and states behavior, relevant boundaries, and expected observable verification results. Do not prescribe files, tests, test actions, commands, implementation steps, or ordinary technical ordering; Apply derives these from current repository evidence.

      **Required structure:**
      - Use one `## Goals` section with one or more `- [ ] G<n>: <goal>` entries.
      - Each goal MUST include one nested `Contract: `<identity>` / Section "<title>"` reference and one `Verify: <behavior, boundary, observable result>` direction.
      - Use goal checkboxes as the only ordinary progress markers. Keep Required Corrections in their separate section.
      - Encode ordering only when explicitly confirmed by the user; ordinary technical dependency order belongs to Apply.
      - Do not include Files, Sections, Checks, test actions, test layers, commands, or execution logs.
      - If target behavior is absent from the Contract, repair the Contract before adding or changing a goal.
      - Keep `proposal.md`, `design.md`, and `tasks.md` distinct: scope, key decisions, and goals with verification directions respectively.

      **Conversion rules:**
      - Goal prose follows `proseLanguage` when configured; structural labels remain canonical.
      - Derive goals from the confirmed target semantics. Merge details serving one observable goal; do not create one goal per Section or Acceptance Case.
      - Apply chooses and records no specific test arrangement in tasks.md. Evidence is evaluated during Apply and independent Review.

      Example:
      ```
      ## Goals

      - [ ] G1: Reject unsupported task layouts
        - Contract: `task-decomposition` / Section "Checks 是任务进度源"
        - Verify: Legacy layouts are rejected; goal-level tasks remain valid.
      ```
    requires:
      - semantic-delta
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the target Contract and project evidence for each pending goal, then choose the implementation steps, files, tests, and commands needed to realize and verify it. For behavior changes, establish credible evidence that the behavior is unmet before implementation when applicable, then run the same behavioral check after implementation. Non-runtime artifact changes require final-state evidence, not artificial failing tests. Mark a goal complete only after implementation and its applicable verification are supported by evidence; do not write execution details back into tasks.md.
    Process Required Corrections before ordinary goals. Technical ordering is selected from repository evidence; follow only ordering explicitly confirmed by the user.
    Pause if you hit blockers or need clarification.
