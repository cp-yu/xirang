name: semantic-model
version: 1
description: Default Xirang workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    definition:
      purpose: Explain why the change is needed and declare its semantic source scope.
      compilationRole: Compilation scaffolding for motivation and source impact.
      content:
        includes:
          - Motivation, scope boundaries, Behavior Source impact, Architecture Source impact, and affected surfaces.
        excludes:
          - Complete observable behavior requirements, complete target-state Semantic Delta entries, lowering decisions, and implementation work.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
    instruction: |
      Create `proposal.md` to explain why the change is needed and bound its semantic source impact.

      Use the template sections:
      - **Why**: State the problem or opportunity and why it matters now in 1-2 sentences.
      - **What Changes**: Summarize intended outcomes and scope, not detailed requirements or implementation steps. Mark breaking changes with **BREAKING**.
      - **Source Impact**:
        - **Behavior Source**: List `New Specs` and `Modified Specs` by element identity. Write `None` when behavior source does not change.
        - **Architecture Source**: List affected element identities and summarize responsibility, ownership, boundary, or relationship impact. Write `None` when architecture source does not change.
      - **Impact**: List affected code, APIs, dependencies, data, operations, or systems.

      Use one shared identity space. Reuse an existing element identity when it already denotes the affected semantic object; introduce one only for a genuinely new Element. An Element has at most one Contract, so Behavior Source and Architecture Source may refer to the same identity.

      The proposal declares source impact; it does not define target content:
      - Complete target-state Semantic Delta entries belong in `elements/`, `metamodel/`, `relationships/`, and `views/`.
      - Lowering and architecture decisions belong in `design.md`.
      - Implementation work and verification belong in `tasks.md`.

      Every declared durable semantic impact must be reconciled through the appropriate Delta partition. Keep the proposal concise and do not repeat requirements, target entries, design rationale, or task steps.
    requires: []

  - id: specs
    generates: "{elements,metamodel,relationships,views}/**/*"
    completionMarker: ".delta-noop"
    description: Semantic Delta units for the change
    template: delta.md
    definition:
      purpose: Express the semantics this Change adds, modifies, or removes.
      compilationRole: Semantic Delta compiled against the current Semantic Model.
      content:
        includes:
          - Complete target-state Semantic Delta entries across elements, metamodel, relationships, and views.
        excludes:
          - Motivation, implementation decisions, rationale, task planning, change-log narration, and Agent reasoning.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
        - xirang arch validate --change <name> --json
    instruction: |
      Create or reconcile the Change's Semantic Delta across `elements/`, `metamodel/`, `relationships/`, and `views/`.

      Treat the returned template as a per-unit shape reference, not one file to copy. If no Semantic Delta is required, create only `.delta-noop`; otherwise remove a stale marker. The marker carries no semantics and MUST NOT be synced or archived.

      Author units by self-declared entity type:
      - Frontmatter declares `entity`; the partition does not determine entity type.
      - element-declaration: identity, kind, parent, title, definition
      - element-kind: identity, contract; optional contractFormat, root, parents, children
      - relationship-kind: identity; optional sourceKinds, targetKinds
      - authored-view: identity, include; optional exclude, of, title, autoLayout
      - Every identity uses `[A-Za-z0-9._-]+`, never a path separator, and must not encode parent hierarchy.
      - Default filenames are organizational conventions only; unchanged partitions stay empty.

      Apply Delta semantics per entry:
      - Declaration, Kind, and View entries add `operation: ADDED|MODIFIED|REMOVED`; ADDED and MODIFIED carry complete target content, while REMOVED carries only identity.
      - Element Contract target content is `## Specification`; Delta Section entries factor operation into `## ADDED Sections`, `## MODIFIED Sections`, and `## REMOVED Sections` sections.
      - ADDED and MODIFIED Sections contain the complete target Section with a canonical `### Section:` header and a free body; REMOVED names only the Section.
      - Existing titles under MODIFIED Sections stay exact; new Section titles follow `proseLanguage` except the four fixed English business-specification titles.
      - Agent MUST NOT author Acceptance Case operation labels.
      - When only Contract entries change, declaration frontmatter locates the Element without `operation`; when only the Declaration changes, leave the body empty.

      Follow partition-specific rules:
      - `elements/` units combine one Element Declaration entry with zero or more Section entries. A Section identity is `<element identity>#<title>` globally and only `<title>` within its unit; complete concept identity and scope prose belongs only in `definition`.
      - `metamodel/` units contain one Element Kind or Relationship Kind entry.
      - `views/` units contain one Authored View entry.
      - `relationships/` YAML contains `{operation, source, kind, target}` entries, has no description field, and does not support `MODIFIED` because the three identity fields are its complete content.

      Business-specification Contracts follow 4+N:
      - Their Element Kind declares `contract: required` and `contractFormat: business-specification`; generic concept Kinds need not use this format.
      - The complete Expected Contract requires non-empty Sections named exactly `Scope and Non-goals`, `Business Logic`, `Edge Cases and Exception Handling`, and `Key Acceptance Cases`, in English regardless of proseLanguage.
      - Keep related mechanisms and diagrams inside Business Logic. Add freely named Sections only for commitments worth maintaining independently, not for each step or engineering characteristic.
      - Key Acceptance Cases must contain at least one non-empty `#### Acceptance Case:` with observable outcomes grounded in confirmed intent, as the basis for TDD. Other Sections must not contain Acceptance Cases.
      - CLI checks the complete Expected Semantic Model; a delta includes only changed Sections. Structure passing does not establish semantic correctness.

      Route motivation to `proposal.md`, decisions to `design.md`, and implementation work to `tasks.md`. Validate with the commands from `definition.validation`, and do not add placeholders, empty Delta sections, or process notes to authored units.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    definition:
      purpose: Record concrete lowering and architecture decisions that the Agent must not guess.
      compilationRole: Compilation scaffolding for implementation strategy, architecture, and constraints.
      content:
        includes:
          - Solution architecture, implementation boundaries, technical decisions, rationale, alternatives, refactoring strategy, risks, trade-offs, and migration decisions.
        excludes:
          - Observable behavior requirements, task progress, repeated motivation, and durable semantic changes not reconciled through the four Delta partitions.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
    instruction: |
      Create the design document that explains HOW to implement the change, documenting confirmed design decisions. Reuse Explore conclusions and the current framing record. Reasonable inferred details, including supporting guarantees, may be authored within the agreed scope and approach without separate confirmation; explain their basis and disclose them at completion. Check authored branch outcomes, defaults, error results and restrictions against confirmed commitments. Changes to confirmed commitments, scope expansion or material business/architecture trade-offs require asking the user before treating a choice as settled. An isolated gap can be confirmed within Propose; substantial redesign returns to Explore.
      Use design.md for technical decisions, refactor rationale, rejected approaches, exploration decisions, implementation strategy, and why an old path should not be used. These belong here instead of specs unless they change externally observable behavior. Reconcile confirmed observable behavior and inferred guarantees with the Semantic Delta and tasks rather than defining it only in design.md.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Coarse implementation tasks with verification checks
    template: tasks.md
    definition:
      purpose: Decompose implementation into executable, evidence-gated work units.
      compilationRole: Compilation scaffolding for sequencing and verification.
      content:
        includes:
          - Coarse work units, affected files, implementation constraints, executable checks, commands, and evidence anchors.
        excludes:
          - New observable behavior, architecture semantics, repeated design rationale, and non-verifiable narration.
      writePolicy: agent-authored
      validation:
        - xirang validate --change <name> --json
    instruction: |
      Create a coarse-grained task list with executable Checks that the apply phase can run through strict evidence gates.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      `### Task N:` headings and nested checkboxes to track progress.

      Required structure:
      - Create one `### Task N: <name>` section per independently implementable and verifiable end-to-end loop
      - Each task MUST include `**Goal**:`, `**Files**:`, `**Sections**:`, and `#### Checks`
      - `Files` MUST use POSIX project-relative paths and label each path as `Create:`, `Modify:`, `Delete:`, or `Test:`
      - File-level deletions (including moves and merges that produce deletions) use `Delete:` declaration; generated-surface changes (such as skill regeneration directories) should be declared at directory granularity
      - `Sections` MUST contain no more than 5 high-level implementation constraints per task; consolidate details or move verification detail into Checks rather than splitting one loop by count
      - `Checks` are executable verification items and MUST use checkbox IDs prefixed with `C`: `- [ ] C1 Verify ...`
      - Each check MUST include `Verifies:` or `Preserves:` before executable evidence fields
      - `Verifies:` identifies the change-local target Section, and its Acceptance Case when the Check verifies a key acceptance case; for deletion deliverables, use `Verifies: ... / REMOVED Section "<name>"`
      - `Preserves:` anchors behavior-equivalence checks to main Element Contract paths (`.xirang/model/elements/<identity>.md` / Section "<title>" / Acceptance Case "<name>"), naming old forms in `Expect:` and absence assertion in `Command:`
      - Each check MUST declare exactly one `Test action:` with a single canonical value: `reuse`, `modify`, `add`, `delete`, or `one-time`; missing, empty, unknown, or duplicate declarations are errors
      - `reuse` runs existing tests unchanged; `modify` updates existing tests; `add` creates new tests; `delete` removes obsolete tests and verifies the remaining behavior or absence; `one-time` collects evidence without creating a persistent test file
      - Inspect existing tests before selecting the action; prefer reuse or modify when they cover the target behavior. Identify affected test paths in Files or the Check body for persistent test actions. Test action does not replace executable evidence
      - Each check MUST include at least one executable evidence field: `Command:`, `Evidence:`, or `Expect:`
      - When this change has local Delta units, `Verifies:` MUST use a change-local relative POSIX path from the change directory: `elements/<identity>.md`
      - `Verifies:` MUST name the full Section title, plus one or more exact Acceptance Case names only when the Check verifies a key acceptance case; except for the REMOVED Section variant
      - `Verifies:` MUST NOT use `.xirang/model/...`, project-root-relative paths, archived/main model paths, absolute paths, parent traversal, or backslash-separated paths
      - `Preserves:` path whitelist is independent: only `.xirang/model/elements/<identity>.md` is allowed; it does not relax `Verifies:` constraints

      Semantic coverage before handoff:
      - Read the complete current confirmed design record when one exists; independently check normative confirmations against the Expected Semantic Model, including conditions, numbers, exceptions, and timing. Informative material belongs in Plan/provenance, not new obligations; already satisfied semantics may be no-op.
      - Then check that each target behavior requiring implementation has concrete work and observable Checks. Valid references alone do not prove behavior coverage. If behavior is missing, repair its Contract before planning; unresolved intent requires a user decision. Do not maintain a second behavior specification in Tasks.
      - State implementation actions and dependencies through Contract references. Prompt sources, managed generated surfaces, and behavioral verification belong in the same loop as the behavior they deliver, not a later polish task.

      Conversion rules:
      - Task titles, check names, requirements bullet prose, and Evidence:/Expect: descriptions follow `proseLanguage` when configured.
      - Structural labels such as `### Task N:`, `Goal`, `Files`, `Sections`, `Checks`, `Verifies:`, `Preserves:`, `Test action:`, `Command:`, `Evidence:`, and `Expect:` remain canonical.
      - Examples show structure only. When `proseLanguage` is configured, do not carry over ordinary English example prose into generated artifacts.
      - For business-specification Contracts, derive test inputs and expected outcomes from Key Acceptance Cases and confirmed Contract commitments; do not invent expected business results from implementation.
      - Derive end-to-end loops from the design or Design Summary, then form task boundaries by TDD closure rather than implementation topology: production code, configuration, generated surfaces, and tests that jointly deliver one behavior MUST stay in one task even when they span components, modules, directories, or file types
      - Split work only when each task reaches its own GREEN independently, or when an explicit delivery sequence makes a task depend only on an earlier task that is already GREEN
      - A task's RED/GREEN cycle MUST NOT depend on a later task; after drafting all tasks, cross-check Goals, Files, Sections, and Checks and reconcile task boundaries before declaring the Change ready for Apply
      - Derive dependencies from each Check's actual implementation, files and commands. Walk tasks in execution order: each Check must be able to reach GREEN using only existing implementation, earlier GREEN tasks and that task. Reorder or regroup work if it needs a later task; ensure referenced test files and commands exist or are provided by then. Declared dependencies alone do not establish executability.
      - Do not split tasks by component, module, directory, or file type; split by spec container when a Section, a safeguards item, or an acceptance case is itself an independently verifiable unit
      - Put technical stack constraints and boundary conditions under Sections, not free-form prose
      - Validation work maps to checks for invalid-input behavior
      - Bug fixes map to a check that reproduces the failure and proves the regression fix
      - Refactors map to a behavior-equivalence check: use `Preserves:` field anchoring a main spec Section, `Expect:` naming the old form (old symbol, old path, or old duplication), and `Command:` with corresponding absence assertion
      - Deletion work maps to a check anchored by `Verifies: ... / REMOVED Section "<name>"` with an absence assertion command
      - non-runtime text or non-runtime artifact changes do not require artificial failing tests, but still need at least one lightweight check with a non-empty `Verifies:` explaining how completion will be verified
      - config, schema, template, workflow template, and agent instruction template changes default to behavior Checks unless the task proves there is no runtime or generated-surface consumer
      - Absence assertions (such as grep empty assertions after deletion) are handled by the non-runtime text fast path: use `Command:` output as final evidence, do not require artificial red/green form
      - The Actions/Checks layout remains supported for older changes, including the required Test action on every Check; new changes SHOULD use the Task/Goal/Files/Sections/Checks format

      Example:
      ```
      ### Task 1: User registration API

      **Goal**: Implement email and password registration.

      **Files**:
      - Create: `src/routes/auth.ts`
      - Modify: `src/app.ts`
      - Test: `tests/auth.test.ts`

      **Sections**:
      - Accept `POST /auth/register`
      - Validate email format
      - Hash passwords before storage

      #### Checks

      - [ ] C1 Verify registration endpoint
        - Verifies: `elements/auth.md` / Section "Key Acceptance Cases" / Acceptance Case "Valid registration succeeds"
        - Test action: add
        - Command: `npm test`
        - Expect: registration test passes

      - [ ] C2 Verify invalid email rejection
        - Verifies: `elements/auth.md` / Section "Key Acceptance Cases" / Acceptance Case "Invalid email is rejected"
        - Test action: add
        - Command: `npm test`
        - Expect: invalid email test passes
      ```

      Reference specs for what needs to be built, design for how to build it.
      Checks are executable verification work, not explanatory prose. The apply phase will execute each pending behavior/code Check through strict red/green TDD and mark checks complete only after red/green evidence or final non-runtime evidence passes.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files and inspect existing tests first. Honor each declared Test action: reuse existing tests unchanged, modify them, add new tests, delete obsolete tests, or collect one-time evidence without a persistent test file. Execute each pending behavior/code Check through strict red/green TDD: prepare the targeted test according to its declared action, run the Check command or equivalent targeted command and confirm the expected failure before implementation, make the minimal implementation, then rerun and confirm pass before marking nested Checks complete.
    For non-runtime text or artifact Checks, do not create artificial failing tests; use the declared Command, Evidence, or Expect fields as final evidence.
    Config, schema, template, workflow template, and agent instruction template Checks default to behavior Checks unless the task proves there is no runtime or generated-surface consumer.
    Pause if you hit blockers or need clarification.
