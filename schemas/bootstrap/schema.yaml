name: bootstrap
version: 1
description: Structured bootstrap workflow — discover and map existing architecture from code

files:
  - id: metadata
    path: ".bootstrap.yaml"
    definition:
      purpose: Store bootstrap lifecycle state, baseline, mode, fingerprints, and timestamps.
      compilationRole: Workflow-managed state for the retained bootstrap run.
      content:
        includes:
          - CLI-owned bootstrap phase and lifecycle metadata.
        excludes:
          - User scope decisions, repository evidence, architecture semantics, and review decisions.
      writePolicy: workflow-managed
      validation:
        - opsx bootstrap status --json
  - id: scope
    path: "scope.yaml"
    definition:
      purpose: Persist the user-approved bootstrap scope and discovery granularity.
      compilationRole: Retained workflow input controlling bootstrap discovery.
      content:
        includes:
          - Approved mode, include and exclude paths, and granularity.
        excludes:
          - Repository evidence, architecture semantics, derived candidates, and workflow state.
      writePolicy: cli-generated
      validation:
        - opsx bootstrap status --json
  - id: evidence
    path: "evidence.yaml"
    definition:
      purpose: Record repository evidence and evidence-backed generic element candidates.
      compilationRole: Retained bootstrap authoring input for architecture discovery.
      content:
        includes:
          - Stable element IDs, project-defined kinds, explicit contract policies, local IDs, titles, summaries, confidence, sources, and legacy domain evidence accepted by the compatibility adapter.
        excludes:
          - Final architecture claims, derived candidates, review approval, and unsupported conclusions.
      writePolicy: agent-authored
      validation:
        - opsx bootstrap validate
  - id: domain-map
    path: "domain-map/*.yaml"
    definition:
      purpose: Interpret repository evidence into a provisional project architecture model.
      compilationRole: Retained bootstrap authoring input compiled into candidate OPSX and Specs.
      content:
        includes:
          - Generic element candidates with explicit contract policies, exactly-one-parent links, canonical semantic relations, singular Spec sources, and review gaps; legacy domain/capability maps are compatibility input only.
        excludes:
          - Derived candidates, final approval, unsupported architecture claims, and mechanical import or call edges presented as semantic relations.
      writePolicy: agent-authored
      validation:
        - opsx bootstrap validate
  - id: candidate-project
    path: "candidate/architecture/{specification,model,views}.c4"
    definition:
      purpose: Present the derived versioned Metamodel, Project Root, arbitrary-depth element tree, and views.
      compilationRole: CLI-generated review projection compiled from retained bootstrap inputs.
      content:
        includes:
          - Project-defined kind declarations, explicit contract policies and constraints, stable elementId metadata, unique-parent nesting, summaries, and views.
        excludes:
          - Semantic relations, delta operations, implementation locations, and review decisions.
      writePolicy: cli-generated
      validation:
        - opsx bootstrap validate
  - id: candidate-relations
    path: "candidate/architecture/relations.c4"
    definition:
      purpose: Present the derived candidate semantic relation set.
      compilationRole: CLI-generated review projection compiled from retained bootstrap inputs.
      content:
        includes:
          - Typed semantic relations between candidate elements, excluding belongs_to, refines, and abstracts.
        excludes:
          - Node definitions, delta operations, mechanical import or call graphs, unsupported relations, and review decisions.
      writePolicy: cli-generated
      validation:
        - opsx bootstrap validate
  - id: candidate-specs
    path: "candidate/specs/**/*.md"
    definition:
      purpose: Present derived candidate behavior Specs when the selected bootstrap mode requires them.
      compilationRole: CLI-generated behavior projection reviewed before controlled promotion.
      content:
        includes:
          - Singular `element` bindings plus complete target-state requirements and scenarios for mapped elements.
        excludes:
          - Architecture semantics, bootstrap evidence, implementation decisions, review state, and change-local delta operations.
      writePolicy: cli-generated
      validation:
        - opsx bootstrap validate
  - id: review
    path: "review.md"
    definition:
      purpose: Present regenerated candidate findings and explicit approval controls.
      compilationRole: Review-controlled gate over the current derived candidates.
      content:
        includes:
          - Candidate summaries, gaps, diffs, fingerprints, and approval checkboxes.
        excludes:
          - Manually copied candidate content, edits outside approval controls, and approval of stale candidates.
      writePolicy: review-controlled
      validation:
        - opsx bootstrap validate
  - id: formal-project
    path: ".opsx/architecture/{specification,model,views}.c4"
    definition:
      purpose: Define the versioned Metamodel, Project Root, arbitrary-depth element hierarchy, and views.
      compilationRole: Durable architecture source in the formal OPSX bundle.
      content:
        includes:
          - Project intent, project-defined kinds with explicit contract policies and constraints, stable element identities, unique-parent refinement nesting, and views.
        excludes:
          - Semantic relations, delta operations, implementation locations, bootstrap evidence, and review state.
      writePolicy: workflow-managed
      validation:
        - opsx validate --all
  - id: formal-relations
    path: ".opsx/architecture/relations.c4"
    definition:
      purpose: Define the complete semantic relations that hold in the current project architecture.
      compilationRole: Durable architecture source in the formal OPSX bundle.
      content:
        includes:
          - All Registry-defined semantic relations between formal OPSX nodes.
        excludes:
          - Node definitions, delta operations, mechanical import or call graphs, speculative relations, and bootstrap review state.
      writePolicy: workflow-managed
      validation:
        - opsx validate --all
  - id: formal-specs
    path: ".opsx/specs/**/*.md"
    definition:
      purpose: Define the observable behavior the current program must continue to exhibit.
      compilationRole: Durable behavior source in the formal Specs collection.
      content:
        includes:
          - Singular element-owned target-state requirements and scenarios.
        excludes:
          - Bootstrap evidence, architecture semantics, implementation decisions, review state, and change-local delta operations.
      writePolicy: workflow-managed
      validation:
        - opsx validate --specs --strict
artifacts:
  - id: init
    generates: .bootstrap.yaml
    description: Initialize bootstrap workspace with scope configuration
    template: init.md
    files:
      - metadata
      - scope
    instruction: |
      Create the bootstrap workspace under .opsx/bootstrap/.

      Run: opsx bootstrap init [--mode full|opsx-first|refresh] --granularity coarse|fine [--scope src/]

      **Granularity**: coarse produces fewer grouped Specs via explicit singular element owners; fine produces per-element Specs. The agent must confirm choice before initial init. A completed workspace restart inherits retained scope.yaml granularity when omitted; an explicit value overrides it.

      This creates:
      - .bootstrap.yaml — metadata (phase, baseline, mode, fingerprints, created_at)
      - scope.yaml — user configuration (mode, include/exclude paths, granularity)

      Supported upgrade paths:
      - specs-based -> full
      - raw -> full
      - raw -> opsx-first
      - formal-opsx -> refresh

      Use opsx-first only when the repository has no existing Specs and you want the formal v1 architecture plus a README-only Specs starter first.
      In that path, add full behavior specs later through normal change workflows.
      Use refresh only when the repository already has a formal baseline. Refresh rebuilds a complete candidate from current evidence as v1; the old model is used only for review diff.

      Confirm the scope configuration with the user before proceeding.
      After init, run opsx bootstrap advance scan and verify status reports phase scan. Do not edit .bootstrap.yaml or call internal APIs.
    requires: []

  - id: scan
    generates: evidence.yaml
    description: Scan codebase for generic elements, entrypoints, and structural evidence
    template: evidence.md
    files:
      - metadata
      - scope
      - evidence
    instruction: |
      Scan the codebase to identify generic candidate elements from current source, Specs, configuration, and package/build metadata.

      For each candidate element, record:
      - elementId: globally unique stable identity
      - kind: project-defined kind
      - contractPolicy: required | optional
      - localId: LikeC4 navigation identifier
      - title and non-empty summary
      - confidence: high | medium | low
      - sources: list of evidence (spec:<path>, code:<path>, readme:<section>)

      CodeGraph MAY accelerate symbol/call/import discovery when already available. Otherwise use ACE, rg, read, and tracked-file search. Do not install CodeGraph automatically.
      Use repository evidence only. Do not fabricate elements or kinds.
      Legacy domains evidence remains accepted only through the explicit compatibility adapter.

      Gates (scan → map):
      - No duplicate stable element IDs
      - Every kind and contract policy is explicit and project-defined
    requires:
      - init

  - id: map
    generates: "domain-map/*.yaml"
    description: Map generic elements, refinement parent links, and semantic relations
    template: domain-map.md
    files:
      - scope
      - evidence
      - domain-map
    instruction: |
      Create one or more domain-map/*.yaml compatibility-path files containing generic candidates and parent links.

      Each generic map contains:
      - elements: elementId, kind, explicit contractPolicy (required | optional), localId, title, summary, and optional singular-bound spec source
      - parent_links: exactly one parent link per non-root element; top-level candidates use project.root
      - relations: precise invokes/produces/consumes/precedes/constrains/validates facts
      - review_gaps: current evidence that cannot be promoted precisely; each entry requires evidence and reason

      Containment is the refinement source. Do not persist belongs_to, refines, or abstracts relations, and do not lower unknown kinds to domain/capability. Imports and calls are evidence only; do not mechanically promote code edges. Legacy domain/capabilities maps remain accepted through the explicit compatibility adapter.
      Run opsx bootstrap status to see element mapping progress.

      Gates (map → review):
      - Every mapped generic element is discovered with the same kind and contract policy
      - Every non-root element has exactly one parent and the tree is reachable and acyclic
      - Stable element IDs and Spec folders are unique
      - Every element kind has one consistent explicit contract policy
      - Relation endpoints, notes, duplicates, and cycles satisfy the Registry contract
    requires:
      - scan

  - id: review
    generates: review.md
    description: Human review and correction of mapped architecture
    template: review.md
    files:
      - evidence
      - domain-map
      - candidate-project
      - candidate-relations
      - candidate-specs
      - review
    instruction: |
      Assemble a complete candidate from current generic element maps and parent links and generate review.md.

      Run: opsx bootstrap validate

      Review Project Root, every element kind/explicit contract policy/stable ID/summary, unique-parent refinement, semantic relation type/direction, unresolved gaps, and singular Spec coverage. In refresh mode, compare the complete candidate with the old formal model, which is review evidence only and must not be copied into the candidate.

      Re-run validate after any evidence.yaml or domain-map edit because review.md is regenerated from current inputs.

      Gates (review → promote):
      - review.md matches the current candidate fingerprint
      - All review.md checkboxes are checked
      - Full Registry-driven relation semantic validation passes
      - Upstream scan/map completeness still passes
      - In refresh mode, the added/modified/removed summary matches the complete current candidate and old formal review baseline
    requires:
      - map

  - id: promote
    generates: .promoted
    description: Validate and write formal OPSX files
    template: promote.md
    files:
      - candidate-project
      - candidate-relations
      - candidate-specs
      - review
      - formal-project
      - formal-relations
      - formal-specs
    instruction: |
      Run: opsx bootstrap promote -y

      This command:
      1. Re-validates scan, map, review, containment, binding, and semantic relation gates
      2. Assembles the complete generic candidate tree from element candidates and parent links
      3. Validates the versioned LikeC4 Metamodel, model, relations, views, and singular-bound Specs together
      4. Atomically writes `.opsx/architecture/*.c4` and reviewed candidate Specs
      5. In raw + opsx-first, additionally writes `.opsx/specs/README.md`
      6. Preserves compatible existing Specs only when explicitly requested
      7. Runs deterministic spec frontmatter backfill automatically
      8. Retains `.opsx/bootstrap/` workspace for audit history

      After promote, run opsx bootstrap backfill-specs --json and report the remaining unmatched Specs; never guess bindings.
      Then run `opsx validate --all`. If validation fails, return to the relevant bootstrap source artifact for repair before claiming completion.

      Confirm before writing to formal OPSX files.
    requires:
      - review

apply:
  requires: [review]
  tracks: review.md
  instruction: |
    Review the mapped architecture in review.md.
    Check each element checkbox after verifying its kind, explicit contract policy, stable identity, unique parent, contract binding, semantic relations, and evidence gaps.
    If evidence.yaml or domain-map files change, run opsx bootstrap validate to regenerate review.md and re-approve it.
    When all checkboxes are checked, run opsx bootstrap promote -y.
