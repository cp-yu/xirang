domain:
  id: dom.ai-integration
  type: domain
  intent: 多工具 AI 支持 — 为 25+ AI 工具生成特定工具的技能文件和面向 Agent 的 workflow skills
  status: active
  boundary: 拥有工具元数据、技能定义和 skills-only workflow surface。不拥有核心规约/变更逻辑。
capabilities:
- id: cap.ai.agent-prompt-guidance
  type: capability
  intent: 面向 Agent 的 verify gate 提示词指引系统。VERIFY_SIMPLE_CHANGE_FAST_PATH 从"允许 master agent 自主跳过"改为"强制委托 optimizer subagent"语义。共享片段（状态机流程图、JSON schema 速查表、CLI 错误恢复决策树）中
    OPTIMIZATION_PROPOSED 行补全 --files 参数，错误恢复增加 FILES_REQUIRED 条目。
  status: active
  spec:
    preserve_existing: true
    folder: agent-prompt-guidance
    purpose: 面向 Agent 的 verify gate 提示词指引系统。VERIFY_SIMPLE_CHANGE_FAST_PATH 从"允许 master agent 自主跳过"改为"强制委托 optimizer subagent"语义。共享片段（状态机流程图、JSON schema 速查表、CLI 错误恢复决策树）中
      OPTIMIZATION_PROPOSED 行补全 --files 参数，错误恢复增加 FILES_REQUIRED 条目。
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.ai.command-generation
  type: capability
  intent: 管理 AI 工具命令生成管线的能力——将 workflow templates 编译为各 AI 工具平台的 command instructions
  status: active
- id: cap.ai.command-slugs
  type: capability
  intent: 管理 OpenSpec CLI 命令的 slug 映射与工具检测，确保跨工具 workflow surface 的命名一致性
  status: active
- id: cap.ai.explore-brainstorming
  type: capability
  intent: Explore 阶段的 brainstorming 流程，包含 6 步 checklist、一次一问纪律、2-3 方案对比、Design Summary 生成；todo 可用时必须在读取 context 前将 Superpowers 阶段记录为 checklist 并逐步 tick；main explore
    agent 严格 read-only，用户设计确认不构成文件写入授权；已有 change 的 insight 仅分类为 future capture target，不在 explore 中更新 artifacts；Superpowers 行为引导通过 referenceFiles 暴露为 OpenSpec-adapted
    brainstorming protocol，以原始 Superpowers brainstorming 的 hard gate、上下文探索、just-in-time visual 判断、分段设计确认、自检和用户审查 gate 为行为来源，并映射到 conversation-only Design Summary
    与 openspec-propose 路由；主 instructions 中的 workflow 引用使用规范形 /opsx:<slug>，经 transform 管线按工具适配渲染
  status: active
  spec:
    preserve_existing: true
    folder: explore-brainstorming
    purpose: Explore 阶段的 brainstorming 流程，包含 6 步 checklist、一次一问纪律、2-3 方案对比、Design Summary 生成；todo 可用时必须在读取 context 前将 Superpowers 阶段记录为 checklist 并逐步 tick；main explore
