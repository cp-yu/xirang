domain:
  id: dom.artifact-graph
  type: domain
  intent: 制品依赖解析、拓扑排序和指令组装的核心引擎
  status: active
  boundary: 拥有图解析和指令加载。不拥有 CLI 输出格式化或技能编排。
capabilities:
- id: cap.artifact-graph.instruction-loader
  type: capability
  intent: 加载 Schema 模板，并按 workflow surface 与 artifact 编译项目配置投影；`proseLanguage` projection 明确新写或改写 prose 的字段范围与 canonical token 保留边界。
  status: active
  spec:
    preserve_existing: true
    folder: instruction-loader
    purpose: 加载 Schema 模板，并按 workflow surface 与 artifact 编译项目配置投影；`proseLanguage` projection 明确新写或改写 prose 的字段范围与 canonical token 保留边界。
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.artifact-graph.parse
  type: capability
  intent: 解析制品依赖关系并构建 DAG，支持循环检测和拓扑排序
  status: active
- id: cap.artifact-graph.schema-resolution
  type: capability
  intent: 解析和验证制品 Schema 定义
  status: active
  spec:
    preserve_existing: true
    folder: schema-resolution
    purpose: 解析和验证制品 Schema 定义
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.artifact-graph.state-tracking
  type: capability
  intent: 通过文件系统追踪制品完成状态
  status: active
relations:
- from: cap.artifact-graph.instruction-loader
  type: belongs_to
  to: dom.artifact-graph
- from: cap.artifact-graph.parse
  type: belongs_to
  to: dom.artifact-graph
- from: cap.artifact-graph.schema-resolution
  type: belongs_to
  to: dom.artifact-graph
- from: cap.artifact-graph.state-tracking
  type: belongs_to
  to: dom.artifact-graph
- from: cap.artifact-graph.instruction-loader
  type: invokes
  to: cap.artifact-graph.parse
- from: cap.artifact-graph.instruction-loader
  type: consumes
  to: cap.config.projection
- from: cap.artifact-graph.instruction-loader
  type: consumes
  to: cap.config.project
- from: cap.artifact-graph.parse
  type: consumes
  to: cap.schema.opsx-delta-artifact
review_gaps: []
