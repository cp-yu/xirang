domain:
  id: dom.cli
  type: domain
  intent: 命令行界面，将所有 OPSX 操作暴露为可组合的子命令
  status: active
  boundary: 拥有终端 I/O 和命令路由。将所有领域逻辑委托给核心模块。
capabilities:
- id: cap.cli.archive
  type: capability
  intent: 归档已完成的变更并将规约合并到主规约目录；输出 agent 接管后续 git 工作的 handoff 提醒，不读取 handoff 模式配置，不执行 git 写操作或生成推荐 commit message；sync gate 检查未合并 delta，--no-sync flag 可跳过
  status: active
  spec:
    preserve_existing: true
    folder: cli-archive
    purpose: 归档已完成的变更并将规约合并到主规约目录；输出 agent 接管后续 git 工作的 handoff 提醒，不读取 handoff 模式配置，不执行 git 写操作或生成推荐 commit message；sync gate 检查未合并 delta，--no-sync flag 可跳过
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.cli.authoring-help
  type: capability
  intent: 通过 opsx help authoring 提供 OPSX 文件级编写帮助及稳定 JSON 输出，同时保持既有 Commander command help 行为。
  status: active
  spec:
    preserve_existing: true
    folder: cli-authoring-help
    purpose: 通过 opsx help authoring 提供 OPSX 文件级编写帮助及稳定 JSON 输出，同时保持既有 Commander command help 行为。
