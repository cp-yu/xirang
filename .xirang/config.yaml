configVersion: 1
schema: semantic-model

decomposition: .pi/skills/xirang-project-decomposition/SKILL.md

context: |
  Tech stack: TypeScript, Node.js (≥22.22.3), ESM modules
  Package manager: pnpm
  CLI framework: Commander.js

  Cross-platform requirements:
  - This tool runs on macOS, Linux, AND Windows
  - Always use path.join() or path.resolve() for file paths - never hardcode slashes
  - Never assume forward-slash path separators
  - Tests must use path.join() for expected path values, not hardcoded strings
  - Consider case sensitivity differences in file systems

rules:
  proposal:
    - 在 Propose 检查本次涉及的 Elements 时，若发现应采用业务规格格式的具体能力
      仍使用非 4+N 的陈旧 Contract，应向用户说明涉及范围，并询问是否在本次 Change
      中进行局部重构；用户确认后再调整 Kind、Declaration、完整 Contract 与相关引用。
      通用概念、组织性 Element 和规范指导不因未采用 4+N 而被判为陈旧格式。
  semantic-delta:
    - Include scenarios for Windows path handling when dealing with file paths
    - Requirements involving paths must specify cross-platform behavior
    - Be explicit about mechanisms, not just outcomes (say HOW, not just WHAT)
    - If we generate artifacts, specify deletion/modification by explicit list
      lookup, not pattern matching
  tasks:
    - Add Windows CI verification as a task when changes involve file paths
    - Include cross-platform testing considerations
    - For generated workflow prompts, preserve exact-text tests only for
      protocol tokens, fail-closed gates, prohibited operations, and explicitly
      retired tokens
    - Do not add persistent tests for explanatory prose, Markdown heading order,
      or example wording
  design:
    - Document any platform-specific behavior or limitations
    - Prefer Node.js path module over string manipulation for paths
    - Use existing constants and lists - don't invent detection mechanisms
    - Prefer explicit lookups over pattern matching or regex
    - If we generate it, we track it by name in a constant
proseLanguage: 中文
git:
  merge:
    strategy: no-ff
  branch:
    deleteAfterArchive: false
apply:
  defaultIsolation: ask
architecture:
  outline:
    definitionDepth: 2
