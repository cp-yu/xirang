name: Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Leave empty on a tag ref.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build Release Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=refs/tags/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            likec4/pnpm-lock.yaml

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${TAG#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: node build.js

      - name: Guard packed CLI version
        run: pnpm run check:pack-version

      - name: Pack tarball
        id: pack
        run: |
          PACKAGE_FILE="xirang-${TAG_VERSION}.tgz"
          npm pack
          echo "package_file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        run: |
          awk -v header="## ${TAG_VERSION}" 'index($0, header) == 1 { found = 1; next } /^## / { if (found) exit } found' \
            CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.pack.outputs.package_file }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          fail_on_unmatched_files: true
