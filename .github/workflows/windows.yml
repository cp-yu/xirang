name: Candidate Views Windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate-windows:
    name: Candidate View runtime and Contract handler (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - name: Install Neovim
        shell: pwsh
        run: |
          choco install neovim --yes --no-progress
          $nvim = Get-ChildItem -Path @("$env:ProgramFiles\Neovim\bin", "$env:ChocolateyInstall\bin", "$env:ChocolateyInstall\lib\neovim", "C:\tools\neovim") -Recurse -Filter nvim.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nvim) { throw "nvim.exe not found after choco install" }
          Add-Content $env:GITHUB_PATH $nvim.DirectoryName
          Write-Host "nvim resolved to: $($nvim.FullName)"
      - run: pnpm install --frozen-lockfile
      - name: Build root workspace
        run: pnpm run build
      - name: Run Candidate View runtime tests
        run: >-
          pnpm exec vitest run
          test/core/view.test.ts
      - name: Verify Windows record paths and build gates
        run: >-
          pnpm exec vitest run
          test/core/project-config.test.ts
          test/core/config-schema.test.ts
          test/core/global-config.test.ts
          test/commands/arch-outline.test.ts
          test/commands/artifact-workflow.test.ts
          test/core/setup.test.ts
          test/core/workflow-installation.test.ts
          test/core/templates/skill-templates-parity.test.ts
          test/core/update.test.ts
          test/core/quality/state.test.ts
          test/commands/quality.test.ts
          test/core/expected-model-writeback.test.ts
          test/integration/nvim-writeback.test.ts
          test/core/record/paths.test.ts
          test/core/record/workspace.test.ts
          test/core/record/consume.test.ts
          test/core/record/coverage.test.ts
          test/commands/config.test.ts
          test/commands/record-json.test.ts
          test/commands/output.test.ts
          test/commands/validate.test.ts
          test/integration/record-workflow.test.ts
          test/commands/candidate-init.test.ts
          test/commands/candidate-validate.test.ts
          test/core/candidate-digest.test.ts
          test/core/candidate-history.test.ts
          test/commands/candidate-promote.test.ts
      - name: Run Neovim Change review checks
        shell: pwsh
        run: |
          foreach ($mode in @('list', 'compare', 'refresh', 'close', 'windows-paths', 'save', 'save-race', 'context')) {
            nvim --headless -u NONE -i NONE -n -l integrations/nvim/tests/run.lua $mode
            if ($LASTEXITCODE -ne 0) { throw "Neovim check failed: $mode" }
          }
      - name: Run Windows Candidate Contract handler tests
        run: >-
          pnpm --dir likec4 exec vitest run --no-isolate
          packages/vite-plugin/src/xirang/xirang-contract-handler.spec.ts
          packages/likec4-spa/src/xirang/HttpContractLoader.spec.ts
