name: OPSX v2 Cross-platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: OPSX v2 contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run test/core/init.test.ts test/commands/help.test.ts test/utils/bootstrap-refresh-utils.test.ts test/core/artifact-graph/resolver.test.ts test/core/artifact-graph/instruction-loader.test.ts test/commands/schema.test.ts
