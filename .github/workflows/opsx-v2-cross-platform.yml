name: OPSX Cross-platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full:
    name: OPSX full validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            likec4/pnpm-lock.yaml

      - name: Install root workspace
        run: pnpm install --frozen-lockfile

      - name: Install vendored LikeC4 workspace
        run: pnpm --dir likec4 install --frozen-lockfile

      - name: Audit OPSX identity
        run: pnpm audit:identity

      - name: Lint root CLI
        run: pnpm lint

      - name: Build root CLI
        run: pnpm build

      - name: Test root CLI
        run: pnpm test

      - name: Typecheck vendored LikeC4
        run: pnpm --dir likec4 typecheck

      - name: Test vendored LikeC4
        run: pnpm --dir likec4 test

      - name: Build vendored LikeC4 runtime
        run: pnpm --dir likec4 build

      - name: Install Chromium dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - name: Test real OPSX browser
        run: pnpm test:e2e
