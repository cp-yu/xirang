name: LikeC4 Windows

on:
  pull_request:
  push:
    branches: [main, opsx-to-likec4-mega-refactor]

permissions:
  contents: read

jobs:
  likec4:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run likec4:install
      - name: Build and typecheck vendored LikeC4
        run: |
          pnpm run likec4:typecheck
          pnpm run likec4:build
      - name: Build and test root workspace
        run: |
          pnpm run lint
          pnpm run build
          pnpm test
      - name: Run Windows path-sensitive root tests
        run: >-
          pnpm exec vitest run
          test/integration/sync-workflow.test.ts
          test/core/setup.test.ts
          test/core/model/candidate-partitions.test.ts
          test/core/model/validator.test.ts
          test/core/model/parser.test.ts
          test/core/model/sync-writer.test.ts
          test/core/likec4/generator.test.ts
          test/core/likec4/generator-validate.test.ts
          test/commands/arch-query.test.ts
          test/commands/arch-search.test.ts
          test/commands/arch-impact.test.ts
          test/core/view.test.ts
      - name: Verify Windows framing paths and build gates
        run: |
          pnpm exec vitest run test/core/framing/paths.test.ts test/core/framing/workspace.test.ts test/integration/framing-workflow.test.ts
          pnpm run build
          pnpm run lint
      - name: Run Windows vendored browser-server tests
        run: >-
          pnpm --dir likec4 exec vitest run --no-isolate
          packages/vite-plugin/src/xirang/xirang-contract-handler.spec.ts
          packages/diagram/src/xirang/architectureView.spec.ts
          packages/diagram/src/likec4diagram/state/machine.state.navigating.spec.ts
          packages/diagram/src/overlays/element-details/ContractsTab.spec.tsx
          packages/diagram/src/overlays/element-details/ElementDetailsCard.spec.tsx
          packages/likec4-spa/src/xirang/HttpContractLoader.spec.ts
          packages/language-server/src/lsp/CompletionProvider.spec.ts
          packages/language-server/src/model/__tests__/model-parser.spec.ts
