domain:
  id: dom.apply
  type: domain
  intent: apply 命令作为编译步骤，集成实现、验证、优化的完整生命周期。确保 apply 输出即验证过的制品
  status: active
capabilities:
- id: cap.apply.branch-isolation
  type: capability
  intent: Apply 阶段分支隔离策略由 apply.defaultIsolation 驱动；main/master 上仅 ask 模式询问用户，branch/worktree/none 配置直接执行并持久化 .apply-isolation.json。
  status: active
  spec:
    preserve_existing: true
    folder: apply-branch-isolation
    purpose: Apply 阶段分支隔离策略由 apply.defaultIsolation 驱动；main/master 上仅 ask 模式询问用户，branch/worktree/none 配置直接执行并持久化 .apply-isolation.json。
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.apply.preflight-scan
  type: capability
  intent: apply 执行前的 tasks.md 一致性预检，扫描 task 间矛盾（同一文件互斥声明、与 spec/design 冲突）和依赖顺序问题（前序 task 引用后序 task 的产出）；对 change-local scenario operation labels 使用 label-free scenario
    title 匹配 Verifies 引用
  status: active
  spec:
    preserve_existing: true
    folder: apply-preflight-scan
    purpose: apply 执行前的 tasks.md 一致性预检，扫描 task 间矛盾（同一文件互斥声明、与 spec/design 冲突）和依赖顺序问题（前序 task 引用后序 task 的产出）；对 change-local scenario operation labels 使用 label-free
      scenario title 匹配 Verifies 引用
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.apply.recovery-protocol-enhanced
  type: capability
  intent: 增强版 Recovery Protocol，引入诊断优先（读错误→定位层面→找 working example→形成假设）、单变量修复约束和累计 3-strike 升级机制；替代原有"error signature 变化即进步"的假设
  status: active
  spec:
    preserve_existing: true
    folder: apply-recovery-protocol-enhanced
    purpose: 增强版 Recovery Protocol，引入诊断优先（读错误→定位层面→找 working example→形成假设）、单变量修复约束和累计 3-strike 升级机制；替代原有"error signature 变化即进步"的假设
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.apply.subagent-orchestration
  type: capability
  intent: apply 严格区分编码与判断角色；master agent 负责 TDD 实现和有证据的 challenge，reviewer 负责正确性判断，optimizer 负责优化价值、优先级与实现级关键设计
  status: active
- id: cap.apply.task-decomposition
  type: capability
  intent: Apply Phase 0 中 Master agent 直接读取 tasks.md、change-local specs、design 与项目代码上下文，但必须按 pending Check 执行严格 TDD。行为/代码 Check 需要 test first、预期失败、最小实现、通过确认后才勾选；非运行时文本制品只需最终证据；缺失断言按非运行时快速路径以
    Command 输出为最终证据。失败处理遵循诊断优先、单变量修复、累计 3-strike 升级机制，不再将 error signature 变化视为进步。
  status: active
  spec:
    preserve_existing: true
    folder: apply-task-decomposition
    purpose: Apply Phase 0 中 Master agent 直接读取 tasks.md、change-local specs、design 与项目代码上下文，但必须按 pending Check 执行严格 TDD。行为/代码 Check 需要 test first、预期失败、最小实现、通过确认后才勾选；非运行时文本制品只需最终证据；缺失断言按非运行时快速路径以
      Command 输出为最终证据。失败处理遵循诊断优先、单变量修复、累计 3-strike 升级机制，不再将 error signature 变化视为进步。
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.apply.tdd-checkpoints
  type: capability
  intent: Apply Phase 0 实现循环中的 3 个 TDD 质量检查点（接口设计可测试性、测试质量标准、Mock 边界约束）
  status: active
- id: cap.apply.verify-integration
  type: capability
  intent: apply 将 Phase 1、finding-driven Phase 2 和 Phase 3 seal 串联；master agent 按 TDD 实现 selected finding，fresh optimizer 负责判断与关键设计，fresh reviewer 负责 speculative
    re-verify
  status: active
  spec:
    preserve_existing: true
    folder: apply-verify-integration
    purpose: apply 将 Phase 1、finding-driven Phase 2 和 Phase 3 seal 串联；master agent 按 TDD 实现 selected finding，fresh optimizer 负责判断与关键设计，fresh reviewer 负责 speculative
      re-verify
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
relations:
- from: cap.apply.branch-isolation
  type: belongs_to
  to: dom.apply
- from: cap.apply.preflight-scan
  type: belongs_to
  to: dom.apply
- from: cap.apply.recovery-protocol-enhanced
  type: belongs_to
  to: dom.apply
- from: cap.apply.subagent-orchestration
  type: belongs_to
  to: dom.apply
- from: cap.apply.task-decomposition
  type: belongs_to
  to: dom.apply
- from: cap.apply.tdd-checkpoints
  type: belongs_to
  to: dom.apply
- from: cap.apply.verify-integration
  type: belongs_to
  to: dom.apply
- from: cap.apply.verify-integration
  type: invokes
  to: cap.cli.verify-aware-instructions
- from: cap.apply.verify-integration
  type: invokes
  to: cap.verify.cli-gate
- from: cap.apply.verify-integration
  type: invokes
  to: cap.verify.optimize
- from: cap.apply.branch-isolation
  type: constrains
  to: cap.archive.branch-merge
- from: cap.apply.branch-isolation
  type: consumes
  to: cap.config.apply-default-isolation
- from: cap.apply.verify-integration
  type: consumes
  to: cap.verify.optimizer-findings
review_gaps: []
