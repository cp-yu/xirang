domain:
  id: dom.schema
  type: domain
  intent: 定义、解析和管理控制制品类型、依赖关系和构建顺序的工作流 Schema
  status: active
  boundary: 拥有 Schema YAML 解析和三层解析逻辑。不拥有制品内容生成。
capabilities:
- id: cap.schema.fork
  type: capability
  intent: 从现有 Schema 创建分支
  status: active
- id: cap.schema.init
  type: capability
  intent: 初始化新的工作流 Schema
  status: active
- id: cap.schema.opsx-delta-artifact
  type: capability
  intent: 将 opsx-delta 注册为 spec-driven schema 中的正式 artifact，提供 template 和 instruction，支持 `openspec instructions opsx-delta` 获取 YAML 结构指引
  status: active
  spec:
    preserve_existing: true
    folder: opsx-delta-artifact
    purpose: 将 opsx-delta 注册为 spec-driven schema 中的正式 artifact，提供 template 和 instruction，支持 `openspec instructions opsx-delta` 获取 YAML 结构指引
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.schema.parse
  type: capability
  intent: 解析工作流 Schema YAML 文件，支持三层解析（内置、项目、变更）
  status: active
- id: cap.schema.validate
  type: capability
  intent: 验证 Schema 结构和制品依赖关系
  status: active
relations:
- from: cap.schema.fork
  type: belongs_to
  to: dom.schema
- from: cap.schema.init
  type: belongs_to
  to: dom.schema
- from: cap.schema.opsx-delta-artifact
  type: belongs_to
  to: dom.schema
- from: cap.schema.parse
  type: belongs_to
  to: dom.schema
- from: cap.schema.validate
  type: belongs_to
  to: dom.schema
review_gaps: []
