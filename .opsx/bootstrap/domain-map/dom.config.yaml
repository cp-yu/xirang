domain:
  id: dom.config
  type: domain
  intent: 项目级和用户级配置管理，带 Schema 验证
  status: active
  boundary: 拥有配置加载、验证和合并。不拥有配置 UI 或交互式提示。
capabilities:
- id: cap.config.apply-default-isolation
  type: capability
  intent: 将 apply.defaultIsolation 作为项目配置的功能性磁盘默认值物化；init 生成配置时写出 ask 默认与允许值注释，update 以 missing-only 方式补齐旧配置且不覆盖用户值。
  status: active
- id: cap.config.apply-projection
  type: capability
  intent: opsx instructions apply 命令输出包含 configProjection，使 apply skill 能读取项目级配置
  status: active
  spec:
    preserve_existing: true
    folder: config-apply-projection
    purpose: opsx instructions apply 命令输出包含 configProjection，使 apply skill 能读取项目级配置
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.config.global
  type: capability
  intent: 加载和验证用户全局配置，配置结构不再包含 profile、workflows 或 delivery 字段。
  status: active
- id: cap.config.migration
  type: capability
  intent: 处理配置格式迁移和破坏性字段清理，包括全局 profile 迁移与项目 config.yaml/config.yml 的默认值补齐；更新时删除陈旧 git.merge.messageFrom、git.autoCommit 与 commitMessage convention 节点并写入新的 git 功能性默认结构
  status: active
- id: cap.config.project
  type: capability
  intent: 加载、验证、合并并物化项目级配置 .opsx/config.yaml；将 git.commitMessage.{boundary,archive,merge} 路径覆盖、merge strategy 与 branch cleanup 字段经 prompt/runtime projection 暴露为
    agent 归档后 git 流程上下文，对残留 autoCommit 与 convention 字段输出废弃 warning
  status: active
- id: cap.config.projection
  type: capability
  intent: 将 config.yaml 编译为 prompt/runtime projections，确保所有 artifact-writing surfaces 共享统一的 prose/canonical/rules 语义边界
  status: active
  spec:
    preserve_existing: true
    folder: config-projection
    purpose: 将 config.yaml 编译为 prompt/runtime projections，确保所有 artifact-writing surfaces 共享统一的 prose/canonical/rules 语义边界
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.config.schema-validation
  type: capability
  intent: 使用 Zod Schema 验证配置结构，并拒绝 active delivery 配置语义。
  status: active
relations:
- from: cap.config.apply-default-isolation
  type: belongs_to
  to: dom.config
- from: cap.config.apply-projection
  type: belongs_to
  to: dom.config
- from: cap.config.global
  type: belongs_to
  to: dom.config
- from: cap.config.migration
  type: belongs_to
  to: dom.config
- from: cap.config.project
  type: belongs_to
  to: dom.config
- from: cap.config.projection
  type: belongs_to
  to: dom.config
- from: cap.config.schema-validation
  type: belongs_to
  to: dom.config
- from: cap.config.apply-default-isolation
  type: consumes
  to: cap.config.project
review_gaps: []
