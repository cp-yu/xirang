schema_version: 1
MODIFIED:
  capabilities:
    - id: cap.validation.spec
      intent: 验证规约的格式和内容；formal specs SHALL NOT contain change-local scenario operation labels such as [ADDED], [MODIFIED], or [REMOVED] in Scenario headings；change-local delta spec 的 scenario operation label 校验规则：MODIFIED section 下每个 scenario 必须有标签，ADDED section 下 [MODIFIED]/[REMOVED] 报错并解释语义原因
    - id: cap.validation.change
      intent: 验证变更的完整性和结构，包括 delta spec section-type 与主 spec header 存在性的交叉验证、scenario operation label 语法与位置校验（MODIFIED 下强制标签、ADDED 下禁止 [MODIFIED]/[REMOVED]、错误信息含语义解释）、surviving scenario 校验（messages 按 section 区分），以及 tasks.md 中 Verifies 字段的确定性结构和 change-local spec 引用校验；Verifies 支持 REMOVED 锚定语法变体（无 Scenario），并以 label-free scenario title 匹配 change-local specs；新增 Preserves 字段校验（仅主 spec 路径白名单，不放宽 Verifies）
    - id: cap.ai.workflow-templates
      intent: 提供 6 个核心工作流的 AI workflow 模板（propose, explore, apply, archive, bootstrap-opsx, snack）。Scenario operation labels 交互规则明确为：仅 MODIFIED Requirements 下每个 scenario 必须带标签，ADDED 下不加，REMOVED 无场景。提示词以精简段落替代冗长表格。
