domain:
  id: dom.verify
  type: domain
  intent: 两阶段质量门禁——在一致性检验通过后，对代码进行最优性检验，将代码从"可用"提升到"精良"
  status: active
capabilities:
- id: cap.ai.subagent-self-read
  type: capability
  intent: Reviewer/Optimizer subagent 自主文件读取与测试执行能力定义，包括 Read+Bash 工具权限、安全约束和 L1 测试策略
  status: active
  spec:
    preserve_existing: true
    folder: subagent-self-read
    purpose: Reviewer/Optimizer subagent 自主文件读取与测试执行能力定义，包括 Read+Bash 工具权限、安全约束和 L1 测试策略
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.sync.evidence-refresh
  type: capability
  intent: sync 完成后自动刷新 .verify-result.json 中与 sync 输出重叠的 evidence 文件哈希，使 verify freshness 判决不受合法 sync 写入的影响
  status: active
  spec:
    preserve_existing: true
    folder: sync-evidence-refresh
    purpose: sync 完成后自动刷新 .verify-result.json 中与 sync 输出重叠的 evidence 文件哈希，使 verify freshness 判决不受合法 sync 写入的影响
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.verify.cli-gate
  type: capability
  intent: 保留 Phase 2 双调用 CLI 表面，并校验 finding JSON actions、CLI-owned stable IDs、dependencies、唯一 selected、状态迁移、append-only history、目标文件 hashes 与 reviewer verdict
  status: active
  spec:
    preserve_existing: true
    folder: verify-cli-gate
    purpose: 保留 Phase 2 双调用 CLI 表面，并校验 finding JSON actions、CLI-owned stable IDs、dependencies、唯一 selected、状态迁移、append-only history、目标文件 hashes 与 reviewer verdict
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.verify.enforce-optimizer-invocation
  type: capability
  intent: 强制每个未跳过的 Phase 2 至少调用 optimizer；NO_OPTIMIZATION_NEEDED 必须由合法 reconciliation envelope 证明，不再接受仅非空 summary 的证据
  status: active
  spec:
    preserve_existing: true
    folder: enforce-optimizer-invocation
    purpose: 强制每个未跳过的 Phase 2 至少调用 optimizer；NO_OPTIMIZATION_NEEDED 必须由合法 reconciliation envelope 证明，不再接受仅非空 summary 的证据
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.verify.execution-model-selection
  type: capability
  intent: verify / archive full verify 固定使用 subagent-orchestrated skeleton，不再按工具选择 current-agent-reread fallback。
  status: active
  spec:
    preserve_existing: true
    folder: verify-execution-model-selection
    purpose: verify / archive full verify 固定使用 subagent-orchestrated skeleton，不再按工具选择 current-agent-reread fallback。
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.verify.freshness-engine
  type: capability
  intent: 维持 change-level evidence freshness，并增加 selected finding 目标文件 hash 校验，阻止 optimizer 裁决后代码变化导致的过期建议被实施
  status: active
  spec:
    preserve_existing: true
    folder: verify-freshness-engine
    purpose: 维持 change-level evidence freshness，并增加 selected finding 目标文件 hash 校验，阻止 optimizer 裁决后代码变化导致的过期建议被实施
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
- id: cap.verify.optimize
  type: capability
  intent: Phase 1 通过后强制委托 optimizer，持久化完整 findings 并逐波次实现最高优先级建议；每波次后基于当前代码全量 reconciliation，成功波次无固定上限，optRetries 只限制失败方向
  status: active
- id: cap.verify.optimizer-findings
  type: capability
  intent: 持久化 Phase 2 optimization findings 的严格 JSON 合约、CLI 稳定 ID、状态机、优先级、append-only reconciliation history、原子波次选择与确定性终止
  status: active
- id: cap.verify.prompt-orchestration
  type: capability
  intent: Verification prompt orchestration patterns。Coordinator 的 Evidence 步骤简化为确定路径。Severity philosophy 表述从"prefer lower tier"改为"escalate when uncertain"，删除降级偏见的措辞
  status: active
  spec:
    preserve_existing: true
    folder: verify-prompt-orchestration
    purpose: Verification prompt orchestration patterns。Coordinator 的 Evidence 步骤简化为确定路径。Severity philosophy 表述从"prefer lower tier"改为"escalate when uncertain"，删除降级偏见的措辞
    requirements:
    - title: Existing formal spec is preserved
      text: The system SHALL preserve the existing formal spec content during OPSX refresh.
      scenarios:
      - title: Refresh preserves existing spec
        steps:
        - keyword: WHEN
          text: the OPSX refresh promotes a candidate with an existing spec path
        - keyword: THEN
          text: the existing spec file remains unchanged
