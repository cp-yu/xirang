schema_version: 2
project:
  id: proj.openspec
  name: OpenSpec
  intent: AI 原生的规约驱动开发系统。在人类意图与 AI 代码生成之间提供轻量级规约层， 确保代码编写前的意图对齐。
  scope: 覆盖 OpenSpec CLI（@fission-ai/openspec v1.x）、其规约引擎、 变更工作流系统、Schema 系统和 AI 工具集成。 不覆盖使用 OpenSpec 的下游项目。
  roots:
    - path: .
domains:
  - id: dom.ai-integration
    intent: 多工具 AI 支持 — 为 25+ AI 工具生成特定工具的技能文件和面向 Agent 的 workflow skills
    type: domain
    boundary: 拥有工具元数据、技能定义和 skills-only workflow surface。不拥有核心规约/变更逻辑。
  - id: dom.apply
    intent: apply 命令作为编译步骤，集成实现、验证、优化的完整生命周期。确保 apply 输出即验证过的制品
    type: domain
  - id: dom.artifact-graph
    intent: 制品依赖解析、拓扑排序和指令组装的核心引擎
    type: domain
    boundary: 拥有图解析和指令加载。不拥有 CLI 输出格式化或技能编排。
  - id: dom.change-workflow
    intent: 管理完整变更生命周期 — 创建、增量规约操作、归档及合并到主规约
    type: domain
    boundary: 拥有变更目录和增量合并逻辑。不拥有规约内容验证规则。
  - id: dom.cli
    intent: 命令行界面，将所有 OpenSpec 操作暴露为可组合的子命令
    type: domain
    boundary: 拥有终端 I/O 和命令路由。将所有领域逻辑委托给核心模块。
  - id: dom.config
    intent: 项目级和用户级配置管理，带 Schema 验证
    type: domain
    boundary: 拥有配置加载、验证和合并。不拥有配置 UI 或交互式提示。
  - id: dom.opsx
    intent: OPSX 编程基础设施，用于架构追踪，包含两文件 YAML 操作、Registry 驱动的语义验证和 delta 合并
    type: domain
    boundary: 拥有 OPSX 文件 I/O、Schema 验证和 delta 合并。不拥有 OPSX 内容生成。
  - id: dom.schema
    intent: 定义、解析和管理控制制品类型、依赖关系和构建顺序的工作流 Schema
    type: domain
    boundary: 拥有 Schema YAML 解析和三层解析逻辑。不拥有制品内容生成。
  - id: dom.validation
    intent: 变更、规约和 OPSX 完整性的验证系统
    type: domain
    boundary: 拥有验证规则和错误报告。不拥有修复建议或自动修复。
  - id: dom.verify
    intent: 两阶段质量门禁——在一致性检验通过后，对代码进行最优性检验，将代码从"可用"提升到"精良"
    status: active
    type: domain
capabilities:
  - id: cap.config.projection
    intent: 将 config.yaml 编译为 prompt/runtime projections，确保所有 artifact-writing surfaces 共享统一的 prose/canonical/rules 语义边界
    status: active
    type: capability
  - id: cap.ai.agent-prompt-guidance
    intent: 面向 Agent 的 verify gate 提示词指引系统。VERIFY_SIMPLE_CHANGE_FAST_PATH 从"允许 master agent 自主跳过"改为"强制委托 optimizer subagent"语义。共享片段（状态机流程图、JSON schema 速查表、CLI 错误恢复决策树）中 OPTIMIZATION_PROPOSED 行补全 --files 参数，错误恢复增加 FILES_REQUIRED 条目。
    type: capability
  - id: cap.ai.command-generation
    intent: 管理 AI 工具命令生成管线的能力——将 workflow templates 编译为各 AI 工具平台的 command instructions
    type: capability
  - id: cap.ai.command-slugs
    intent: 管理 OpenSpec CLI 命令的 slug 映射与工具检测，确保跨工具 workflow surface 的命名一致性
    type: capability
  - id: cap.ai.explore-brainstorming
    intent: Explore 阶段的 brainstorming 流程，包含 6 步 checklist、一次一问纪律、2-3 方案对比、Design Summary 生成；todo 可用时必须在读取 context 前将 Superpowers 阶段记录为 checklist 并逐步 tick；main explore agent 严格 read-only，用户设计确认不构成文件写入授权；已有 change 的 insight 仅分类为 future capture target，不在 explore 中更新 artifacts；Superpowers 行为引导通过 referenceFiles 暴露为 OpenSpec-adapted brainstorming protocol，以原始 Superpowers brainstorming 的 hard gate、上下文探索、just-in-time visual 判断、分段设计确认、自检和用户审查 gate 为行为来源，并映射到 conversation-only Design Summary 与 openspec-propose 路由；主 instructions 中的 workflow 引用使用规范形 /opsx:<slug>，经 transform 管线按工具适配渲染
    type: capability
  - id: cap.ai.impact-sweeper
    intent: 以 OPSX capability relation paths、cap-to-spec contracts 与当前代码证据生成语义影响报告；CodeGraph 可选，不可用时回退 ACE、rg 与 read。
    status: active
    type: capability
  - id: cap.ai.optimizer-skill
    intent: Phase 2 finding-first 通用优化审查者；基于当前代码输出多个证据化 findings、修改意见、关键设计、保持约束和验证建议，不修改文件、不输出逐字补丁、不受固定优化 taxonomy 限制
    type: capability
  - id: cap.ai.propose-smart-routing
    intent: Propose 阶段的智能路由与 artifact 生成 guidance；生成 specs 时应用 schema content boundary，post-propose validation 后显式运行 `openspec scenario-labels <change> --write` 生成 change-local review metadata，并消费共享 artifact language contract；写入 change-local specs 前提示使用 `openspec check-delta` 检查计划引用；post-propose validation guidance 使用 artifact-scoped validate 命令分阶段检查 specs 与 opsx-delta
    type: capability
  - id: cap.ai.reviewer-cleanliness-dimension
    intent: Cleanliness 维度的检测逻辑、severity 映射和跨语言工具适配策略，用于检测重构残留、孤儿代码、过时 TODO、半迁移等遗留物；新增规格外改动检测——以 task Files 声明（含目录条目）、Check 证据文件与 change 工件构成归因宇宙，diff 中无法归因的行为代码升级 CRITICAL，机械性良性改动降级
    type: capability
  - id: cap.ai.reviewer-skill
    intent: Phase 1 验证审查 subagent skill。元规则从"不确定时降级"反转为"不确定时升级"，Correctness/Coherence trigger 强化（spec 偏离和设计违背升为 CRITICAL），新增 Cleanliness 维度检测，summary schema 扩展包含 cleanliness 指标。判定模式按 Check 锚点类型分派：Verifies 普通 requirement 执行存在性判定，REMOVED 锚点执行缺失性判定（残留即 CRITICAL），Preserves 锚点执行双支等价性判定（行为不变 ∧ 旧形态消失）；Completeness 对 Files Delete 声明与 git diff 逐项核对
    type: capability
  - id: cap.ai.skill-generation
    intent: AI 技能文件生成是唯一受管 workflow surface，通过 manifest registry 生成 SkillTemplate 制品，暴露 skills-only workflow surface。为 propose、explore、apply-change、archive-change、bootstrap-opsx、snack 等 workflow 生成 SkillTemplate。
    status: active
    type: capability
  - id: cap.ai.subagent-self-read
    intent: Reviewer/Optimizer subagent 自主文件读取与测试执行能力定义，包括 Read+Bash 工具权限、安全约束和 L1 测试策略
    type: capability
  - id: cap.ai.template-artifact-pipeline
    intent: 统一的 skills-only artifact 生成管线，基于固定 workflow manifest entries 生成 skill 制品，modeMembership 作为标签系统而非 profile 过滤条件。
    type: capability
  - id: cap.ai.tool-adapters
    intent: 为支持的 AI 工具提供 skills 路径、transform 与 invocation guidance 元数据；不再维护 adapter-backed command generation 能力。
    status: active
    type: capability
  - id: cap.ai.tool-invocation-references
    intent: 基于共享 workflow surface 元数据渲染不同 AI 工具的用户可调用 skill 引用；Codex 使用 $<skillDirName>，Claude Code 使用 /<skillDirName>，Pi 使用 /skill:<skillDirName>，OpenCode 使用 /opsx-<commandSlug>；没有精确工具语法时使用中性 skill invocation 文案。
    type: capability
  - id: cap.ai.verify-writeback
    intent: 验证结果回写 tasks.md（unmark 未真正完成的任务）并生成分类 remediation 清单（code_fix / artifact_fix），同时让 write-back prose 遵守统一 runtime projection
    status: active
    type: capability
  - id: cap.ai.workflow-templates
    intent: 提供消费 Registry-generated relation reference、OPSX v2 两文件导航与实时代码证据分层规则的核心 workflow skill 模板。
    type: capability
  - id: cap.apply.branch-isolation
    intent: Apply 阶段分支隔离策略由 apply.defaultIsolation 驱动；main/master 上仅 ask 模式询问用户，branch/worktree/none 配置直接执行并持久化 .apply-isolation.json。
    type: capability
  - id: cap.apply.subagent-orchestration
    intent: apply 严格区分编码与判断角色；master agent 负责 TDD 实现和有证据的 challenge，reviewer 负责正确性判断，optimizer 负责优化价值、优先级与实现级关键设计
    type: capability
  - id: cap.apply.task-decomposition
    intent: Apply Phase 0 中 Master agent 直接读取 tasks.md、change-local specs、design 与项目代码上下文，但必须按 pending Check 执行严格 TDD。行为/代码 Check 需要 test first、预期失败、最小实现、通过确认后才勾选；非运行时文本制品只需最终证据；缺失断言按非运行时快速路径以 Command 输出为最终证据。失败处理遵循诊断优先、单变量修复、累计 3-strike 升级机制，不再将 error signature 变化视为进步。
    type: capability
  - id: cap.apply.verify-integration
    intent: apply 将 Phase 1、finding-driven Phase 2 和 Phase 3 seal 串联；master agent 按 TDD 实现 selected finding，fresh optimizer 负责判断与关键设计，fresh reviewer 负责 speculative re-verify
    type: capability
  - id: cap.archive.branch-merge
    intent: 归档后的 git commit、merge 与 branch cleanup 由 agent 无条件继续处理；agent 先提交残余实现 diff（如有），再无条件创建 --allow-empty 的 semantic boundary commit 承载完整 change 总结（Why/Changes + Implementation footer），随后提交归档制品；message 模板按 git.commitMessage.* 路径覆盖或 openspec/references/ 内置模板路由
    status: active
    type: capability
  - id: cap.artifact-graph.instruction-loader
    intent: 加载 Schema 模板，并按 workflow surface 与 artifact 编译项目配置投影；`proseLanguage` projection 明确新写或改写 prose 的字段范围与 canonical token 保留边界。
    status: active
    type: capability
  - id: cap.artifact-graph.parse
    intent: 解析制品依赖关系并构建 DAG，支持循环检测和拓扑排序
    status: active
    type: capability
  - id: cap.artifact-graph.schema-resolution
    intent: 解析和验证制品 Schema 定义
    status: active
    type: capability
  - id: cap.artifact-graph.state-tracking
    intent: 通过文件系统追踪制品完成状态
    status: active
    type: capability
  - id: cap.change.archive
    intent: 归档已完成的变更，移动变更到 archive；archive 在校验通过后将 change 目录移入 archive，不执行 spec 或 OPSX 写入操作；同步合并由 openspec sync 独立完成
    status: active
    type: capability
  - id: cap.change.create
    intent: 变更创建和管理，支持新的 explore → propose 工作流和 apply 直接执行任务模型
    status: active
    type: capability
  - id: cap.change.discovery
    intent: 发现和列举项目中的变更和规约
    status: active
    type: capability
  - id: cap.change.metadata
    intent: 管理变更元数据（创建时间、状态、描述）
    status: active
    type: capability
  - id: cap.change.specs-sync
    intent: 将变更中的 delta specs 和 OPSX delta 同步到主规约与主 OPSX；sync 不写回 change-local scenario operation labels，写入 formal specs 前清洗已有 [ADDED]/[MODIFIED] labels 并省略已有 [REMOVED] scenario blocks；重复 sync 对 normalized requirement 内容保持幂等
    status: active
    type: capability
  - id: cap.cli.archive
    intent: 归档已完成的变更并将规约合并到主规约目录；输出 agent 接管后续 git 工作的 handoff 提醒，不读取 handoff 模式配置，不执行 git 写操作或生成推荐 commit message；sync gate 检查未合并 delta，--no-sync flag 可跳过
    status: active
    type: capability
  - id: cap.cli.change
    intent: 管理变更提案，包含创建、列表和操作的子命令
    status: active
    type: capability
  - id: cap.cli.command-reference-consistency
    intent: Ensure active documentation, generated Agent instructions, skills, prompts, and workflow templates reference only supported OpenSpec CLI command forms and report historical archive-only stale references separately.
    type: capability
  - id: cap.cli.completion
    intent: 管理 OpenSpec CLI 的 shell 补全，通过运行时反射 Commander.js 命令树自动派生补全数据，不再依赖静态 COMMAND_REGISTRY
    type: capability
  - id: cap.cli.config
    intent: 查看和修改全局 OpenSpec 配置（不含 profile 子命令），查询归一化项目配置
    status: active
    type: capability
  - id: cap.cli.feedback
    intent: 提交关于 OpenSpec 的反馈
    status: active
    type: capability
  - id: cap.cli.init
    intent: 在项目中初始化 OpenSpec，固定安装 workflow skills，无需 profile 或 delivery 配置，且不生成 slash command workflow artifacts。
    status: active
    type: capability
  - id: cap.cli.init-opsx-skeleton
    intent: init 命令首次运行时生成 schema_version 2 的 project.opsx.yaml 与 project.opsx.relations.yaml 两个最小骨架，并引导用户运行 bootstrap-opsx skill 完成架构映射。
    status: active
    type: capability
  - id: cap.cli.instructions
    intent: 指令生成系统，apply 指令返回任务状态并要求 behavior/code Checks 执行严格 red/green TDD；tasks 指令生成 coarse Task + Checks 结构，不再暗示生成 .apply-steps 或依赖 implementer。
    status: active
    type: capability
  - id: cap.cli.list
    intent: 列出变更或 specs，specs 模式支持 JSON 输出包含 capabilities 字段与 requirement header 名称列表
    status: active
    type: capability
  - id: cap.cli.new-change
    intent: 创建新的变更目录
    status: active
    type: capability
  - id: cap.cli.opsx-query
    intent: 批量查询 OPSX v2 节点与有向语义 relations，支持 depth 展开和 relation path 证据，不提供 code-map 输入或输出 surface。
    type: capability
  - id: cap.cli.schema
    intent: 管理工作流 Schema，包含 init、fork 和 which 子命令
    status: active
    type: capability
  - id: cap.cli.schemas
    intent: 列出可用的工作流 Schema 及其描述
    status: active
    type: capability
  - id: cap.cli.show
    intent: 显示变更或规约的详细信息
    status: active
    type: capability
  - id: cap.cli.spec
    intent: 使用 show 和 validate 子命令管理和查看 OpenSpec 规约；list 功能已迁移到 openspec list --specs
    status: active
    type: capability
  - id: cap.cli.status
    intent: 显示变更的制品完成状态
    status: active
    type: capability
  - id: cap.cli.sync
    intent: 顶层 CLI 命令，将 change 中的 delta specs 和 OPSX delta 同步到主文件，不执行归档；sync 允许未标注的 change-local scenarios，消费并清洗已有 [ADDED]/[MODIFIED] labels，省略已有 [REMOVED] scenario blocks，但不生成或写回 scenario operation labels
    status: active
    type: capability
  - id: cap.cli.templates
    intent: 显示 Schema 中所有制品的已解析模板路径
    status: active
    type: capability
  - id: cap.cli.update
    intent: 刷新 OpenSpec skills，固定更新 workflow skills，自动清理过时的 profile/workflows/delivery 配置字段，不生成、刷新或清理旧 command workflow artifacts。
    status: active
    type: capability
  - id: cap.cli.validate
    intent: 验证变更和规约的完整性，支持显式 change scope 与 specs/opsx-delta artifact scope 分阶段验证
    status: active
    type: capability
  - id: cap.cli.verify-aware-instructions
    intent: instructions apply 命令在判定 change 完成状态时集成 verify freshness 检查，返回 needs_verify/needs_seal/all_done 三态而非仅基于 task checkbox
    type: capability
  - id: cap.cli.view
    intent: 显示规约和变更的交互式仪表板，task 全部完成的分类标签改为 "Tasks Done"
    status: active
    type: capability
  - id: cap.config.apply-default-isolation
    intent: 将 apply.defaultIsolation 作为项目配置的功能性磁盘默认值物化；init 生成配置时写出 ask 默认与允许值注释，update 以 missing-only 方式补齐旧配置且不覆盖用户值。
    status: active
    type: capability
  - id: cap.config.global
    intent: 加载和验证用户全局配置，配置结构不再包含 profile、workflows 或 delivery 字段。
    status: active
    type: capability
  - id: cap.config.migration
    intent: 处理配置格式迁移和破坏性字段清理，包括全局 profile 迁移与项目 config.yaml/config.yml 的默认值补齐；更新时删除陈旧 git.merge.messageFrom、git.autoCommit 与 commitMessage convention 节点并写入新的 git 功能性默认结构
    status: active
    type: capability
  - id: cap.config.project
    intent: 加载、验证、合并并物化项目级配置 openspec/config.yaml；将 git.commitMessage.{boundary,archive,merge} 路径覆盖、merge strategy 与 branch cleanup 字段经 prompt/runtime projection 暴露为 agent 归档后 git 流程上下文，对残留 autoCommit 与 convention 字段输出废弃 warning
    status: active
    type: capability
  - id: cap.config.schema-validation
    intent: 使用 Zod Schema 验证配置结构，并拒绝 active delivery 配置语义。
    status: active
    type: capability
  - id: cap.opsx.atomic-write
    intent: 使用临时文件 + 重命名模式实现原子写入
    status: active
    type: capability
  - id: cap.opsx.bootstrap
    intent: 通过五阶段流程从当前源码、specs 与可选代码图证据完整生成、review 并 promote OPSX v2 project 与 relations 两文件模型。
    status: active
    type: capability
  - id: cap.opsx.bootstrap-backfill-specs
    intent: Backfill Engine——通过命名匹配和 LLM 语义推断为无 frontmatter 的 specs 批量补全 capabilities 关联声明
    type: capability
  - id: cap.opsx.bootstrap-refresh
    intent: 从当前源码、specs 与配置完整重建 OPSX v2 candidate，以旧 formal OPSX 生成 review diff，审批后整体替换两份正式文件。
    status: active
    type: capability
  - id: cap.opsx.delta-merge
    intent: 将 opsx-delta.yaml 的 ADDED/MODIFIED/REMOVED nodes 与 canonical relations 合并到 OPSX v2 两文件模型，并执行 Registry-driven relation semantic validation。
    status: active
    type: capability
  - id: cap.opsx.read-transparent
    intent: 透明读取并合并 OPSX v2 project 与 relations 两文件模型，不依赖 code-map companion file。
    status: active
    type: capability
  - id: cap.opsx.referential-integrity
    intent: 验证所有关系的 from/to 引用是否存在
    status: active
    type: capability
  - id: cap.opsx.yaml-operations
    intent: YAML 序列化/反序列化，支持注释保留和格式化
    status: active
    type: capability
  - id: cap.schema.fork
    intent: 从现有 Schema 创建分支
    status: active
    type: capability
  - id: cap.schema.init
    intent: 初始化新的工作流 Schema
    status: active
    type: capability
  - id: cap.schema.opsx-delta-artifact
    intent: 将 opsx-delta 注册为 spec-driven schema 中的正式 artifact，提供 template 和 instruction，支持 `openspec instructions opsx-delta` 获取 YAML 结构指引
    type: capability
  - id: cap.schema.parse
    intent: 解析工作流 Schema YAML 文件，支持三层解析（内置、项目、变更）
    status: active
    type: capability
  - id: cap.schema.validate
    intent: 验证 Schema 结构和制品依赖关系
    status: active
    type: capability
  - id: cap.spec.frontmatter
    intent: Spec 文件 YAML frontmatter 解析，提取 capabilities 关联声明
    type: capability
  - id: cap.spec.registry
    intent: 运行时 cap↔spec 双向映射注册表，提供 getSpecsForCap、getCapsForSpec、getOrphanedSpecs、getUncoveredCaps 查询 API
    type: capability
  - id: cap.sync.evidence-refresh
    intent: sync 完成后自动刷新 .verify-result.json 中与 sync 输出重叠的 evidence 文件哈希，使 verify freshness 判决不受合法 sync 写入的影响
    type: capability
  - id: cap.validation.change
